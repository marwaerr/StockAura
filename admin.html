<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StockAura — Gestion</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<nav id="nav"></nav>
<main id="main"><p class="sub">Chargement…</p></main>
</div>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dh=n=>Math.round(n||0).toLocaleString('fr-FR')+' DH';
const round2=n=>Math.round(n*100)/100;
const today=()=>new Date().toISOString().slice(0,10);
const fd=d=>d?d.split('-').reverse().join('/'):'';
const LOW=5;
const ROLE={admin:'Administrateur',vendeur:'Vendeur',magasinier:'Magasinier'};
const PERM={admin:['menu','home','products','entries','sales','returns','cash','history','profit','promotions','reviews','settings','users'],vendeur:['menu','home','products','sales','returns','cash','history'],magasinier:['menu','home','products','entries','history']};
let session=null, me=null, products=[], view='menu';
let lang=localStorage.getItem('sa_lang')||'fr';
document.documentElement.dir=lang==='ar'?'rtl':'ltr';
if(localStorage.getItem('sa_theme')==='dark')document.documentElement.dataset.theme='dark';
const TR={
 fr:{menu:'Accueil',home:'Tableau de bord',products:'Produits',entries:'Entrées',sales:'Ventes',returns:'Retours',cash:'Caisse',history:'Historique',profit:'Profit',promotions:'Promotions',users:'Utilisateurs',logout:'Se déconnecter',hello:'Salut',add:'Ajouter',save:'Enregistrer',cancel:'Annuler',search:'Rechercher',name:'Nom',price:'Prix',qty:'Quantité',date:'Date',supplier:'Fournisseur',reference:'Référence',category:'Catégorie',subcategory:'Sous-catégorie',photo:'Photo',product:'Produit',barcode:'Code-barres',stock:'Stock'},
 ar:{menu:'الرئيسية',home:'لوحة القيادة',products:'المنتجات',entries:'المدخلات',sales:'المبيعات',returns:'المرتجعات',cash:'الصندوق',history:'السجل',profit:'الربح',promotions:'العروض',users:'المستخدمون',logout:'تسجيل الخروج',hello:'مرحبا',add:'إضافة',save:'حفظ',cancel:'إلغاء',search:'بحث',name:'الاسم',price:'السعر',qty:'الكمية',date:'التاريخ',supplier:'المورد',reference:'المرجع',category:'الفئة',subcategory:'الفئة الفرعية',photo:'صورة',product:'المنتج',barcode:'الباركود',stock:'المخزون'}
};
const t=k=>TR[lang][k]||TR.fr[k]||k;
function setLang(l){lang=l;localStorage.setItem('sa_lang',l);document.documentElement.dir=l==='ar'?'rtl':'ltr';render()}
function toggleTheme(){const r=document.documentElement,d=r.dataset.theme==='dark';r.dataset.theme=d?'light':'dark';localStorage.setItem('sa_theme',d?'light':'dark')}
const displayName=n=>n&&n.includes('@')?n.split('@')[0]:n;
let hist={type:'all',q:''}, entryLines=[{}], cart=[], saleMeta={disc:'pct',discVal:'',payment:'cash',given:''}, lastReceipt=null, ret={}, cm={amount:'',note:''}, prodQ='';

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
function can(v){return me&&PERM[me.role]?.includes(v)}
const isAdmin=()=>me&&me.role==='admin';

/* ---------- Auth ---------- */
async function boot(){
 const {data}=await sb.auth.getSession();
 session=data.session;
 if(session)await loadMe();
 render();
}
sb.auth.onAuthStateChange(async(_e,s)=>{session=s;if(s)await loadMe();else me=null;render()});
async function loadMe(){
 const{data,error}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
 if(!error)me=data;
}
async function doLogin(){
 const idf=$('#li').value.trim(),pw=$('#lp').value;
 if(!idf||!pw){toast('Identifiant et mot de passe requis');return}
 const email=idf.includes('@')?idf:idf+'@stockaura.app';
 $('#lbtn').innerHTML='<span class="spin"></span>Connexion…';
 const{error}=await sb.auth.signInWithPassword({email,password:pw});
 if(error){toast('Identifiant ou mot de passe incorrect');$('#lbtn').textContent='Se connecter'}
}
function loginView(){
 return `<div class="login-wrap"><h1>StockAura 🎉</h1><p class="sub">Connectez-vous pour accéder à votre boutique.</p>
 <div class="card"><label for="li">Identifiant</label><input id="li" style="margin-bottom:12px" autocomplete="username">
 <label for="lp">Mot de passe</label><input id="lp" type="password" style="margin-bottom:16px" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
 <button class="btn" id="lbtn" onclick="doLogin()">Se connecter</button></div>
 <p class="hint">Pas encore de compte ? Un administrateur peut en créer un depuis Supabase (Authentication → Add user), puis vous attribuer un rôle ici dans Utilisateurs.</p></div>`;
}
function logout(){sb.auth.signOut()}

/* ---------- Icônes ---------- */
const I={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/>',in:'<path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/>',cart:'<path d="M3 4h2l2 11h11l2-8H6"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.5M3 12h.5M3 18h.5"/>',trend:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',alert:'<path d="M12 3l10 18H2zM12 10v5M12 18v.5"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',wallet:'<path d="M3 7a2 2 0 0 1 2-2h13a1 1 0 0 1 1 1v3M3 7v11a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1h-4a2 2 0 1 0 0 4h5"/>',megaphone:'<path d="M3 11v2a2 2 0 0 0 2 2h1l3 5V6l-3 5H5a2 2 0 0 0-2 2z"/><path d="M11 6l8-3v18l-8-3"/>'};
const ic=n=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

/* ---------- Nav ---------- */
function renderNav(){
 const items=[['menu',t('menu'),'home'],['home',t('home'),'trend'],['products',t('products'),'box'],['entries',t('entries'),'in'],['sales',t('sales'),'cart'],['returns',t('returns'),'in'],['cash',t('cash'),'wallet'],['history',t('history'),'list'],['profit',t('profit'),'trend'],['promotions',t('promotions'),'megaphone'],['reviews','Avis','users'],['settings','Paramètres','box'],['users',t('users'),'users']].filter(x=>can(x[0]));
 $('#nav').innerHTML='<div class="logo">StockAura</div><div class="me"><i>'+esc(displayName(me.name).slice(0,2).toUpperCase())+'</i><b>'+esc(displayName(me.name))+'</b><span>'+ROLE[me.role]+'</span></div>'
 +items.map(([k,l,i])=>`<button data-c="${k}" class="${view===k?'on':''}" onclick="go('${k}')">${ic(i)}${l}</button>`).join('')
 +`<div class="spacer"></div>
 <div class="row" style="margin:0 0 8px;gap:6px"><button class="tg" aria-label="Mode sombre" onclick="toggleTheme()" style="flex:none"></button><select onchange="setLang(this.value)" style="min-height:32px;padding:2px 6px"><option value="fr" ${lang==='fr'?'selected':''}>FR</option><option value="ar" ${lang==='ar'?'selected':''}>AR</option></select></div>
 <button class="small" onclick="logout()">${t('logout')}</button>`;
}
async function go(v){view=v;await render()}

/* ---------- Data ---------- */
async function loadProducts(){
 const{data,error}=await sb.from('products').select('id,name,price,cost,photo_url,visible,low_threshold,category,subcategory,variants(id,variant,color,barcode,quantity)').order('created_at');
 if(error){toast(error.message);return[]}
 return data||[];
}
const combos=()=>products.flatMap(p=>p.variants.map(v=>({p,v,q:v.quantity})));
function findByBarcode(code){code=(code||'').trim();if(!code)return null;for(const p of products)for(const v of p.variants)if(v.barcode===code)return{p,v};return null}
function prodOf(variantId){for(const p of products)for(const v of p.variants)if(v.id===variantId)return{p,v};return null}
let categories=[],subcategories=[];
async function loadCategories(){
 const[{data:c},{data:s}]=await Promise.all([sb.from('categories').select('*').order('sort').order('name'),sb.from('subcategories').select('*').order('name')]);
 categories=c||[];subcategories=s||[];
}
async function refreshCats(){await loadCategories();await render()}

/* ---------- Rendu principal ---------- */
async function render(){
 if(!session||!me){$('#nav').innerHTML='';$('#main').innerHTML=loginView();return}
 if(!products.length)products=await loadProducts();
 if(!categories.length)await loadCategories();
 if(!can(view))view='menu';
 renderNav();
 const views={menu,home,products:productsView,entries,sales,returns,cash,history,profit,promotions,reviews,settings,users};
 const y=window.scrollY;
 const html=await views[view]();
 $('#main').innerHTML=html;
 window.scrollTo(0,y);
}
async function refresh(){products=await loadProducts();await render()}

/* ---------- Menu ---------- */
function menu(){
 const items=[['home','Tableau de bord','trend'],['products','Produits','box'],['entries','Entrées','in'],['sales','Ventes','cart'],['returns','Retours','in'],['cash','Caisse','wallet'],['profit','Profit','trend'],['history','Historique','list'],['promotions','Promotions','megaphone'],['reviews','Avis','users'],['settings','Paramètres','box'],['users','Utilisateurs','users']].filter(x=>can(x[0]));
 return `<h1>${t('hello')} ${esc(displayName(me.name))} 👋</h1><p class="sub">Que voulez-vous faire ?</p>
 <div class="menu">${items.map(([k,l,i],idx)=>`<button class="mtile c${idx%6}" onclick="go('${k}')">${ic(i)}<span>${l}</span></button>`).join('')}</div>`;
}

/* ---------- Tableau de bord ---------- */
let hp=null;
function setPreset(k){const t=new Date(),to=today();let f=to;if(k==='week'){const d=new Date(t);d.setDate(d.getDate()-6);f=d.toISOString().slice(0,10)}if(k==='month')f=to.slice(0,8)+'01';if(k==='year')f=to.slice(0,5)+'01-01';hp={from:f,to,k};go('home')}
async function home(){
 if(!products.length)return `<h1>${t('hello')} ${esc(displayName(me.name))} 👋</h1><p class="sub">Ajoutez un produit, une entrée, puis vendez : le stock se met à jour tout seul.</p><div class="card"><button class="btn" onclick="go('products')">Ajouter mon premier produit</button></div>`;
 if(!hp){const t=today();hp={from:t.slice(0,8)+'01',to:t,k:'month'}}
 const{data:moves}=await sb.from('moves').select('*, variants(variant,color,product_id)').gte('date',hp.from).lte('date',hp.to);
 const m=moves||[],sgn=x=>x.type==='out'?1:-1,trans=m.filter(x=>x.type==='out'||x.type==='return'),salesM=m.filter(x=>x.type==='out');
 const ca=trans.reduce((s,x)=>s+sgn(x)*x.qty*x.unit_price,0),pf=trans.reduce((s,x)=>s+sgn(x)*x.qty*(x.unit_price-(x.cost||0)),0);
 const c=combos(),total=c.reduce((s,x)=>s+x.q,0),low=c.filter(x=>x.q<=(x.p.low_threshold||LOW)),out0=c.filter(x=>x.q<=0).length;
 const card=(t,i,v,l)=>`<div class="oc" data-t="${t}"><span class="ic">${ic(i)}</span><div><b>${v}</b><span>${l}</span></div></div>`;
 const presets=[['day',"Aujourd'hui"],['week','7 jours'],['month','Ce mois'],['year','Cette année']];
 const{data:recent}=await sb.from('moves').select('*, variants(variant,color,product_id)').order('date',{ascending:false}).order('created_at',{ascending:false}).limit(6);
 return `<h1>${t('hello')} ${esc(displayName(me.name))} 👋</h1><p class="sub">Voici où en est votre boutique.</p>
 <div class="per"><div class="seg">${presets.map(([k,l])=>`<button class="${hp.k===k?'on':''}" onclick="setPreset('${k}')">${l}</button>`).join('')}</div>
 <label>Du <input type="date" value="${hp.from}" onchange="hp.from=this.value;hp.k='';go('home')"></label><label>Au <input type="date" value="${hp.to}" onchange="hp.to=this.value;hp.k='';go('home')"></label></div>
 <div class="ovp"><h2>Aperçu</h2><div class="ov">
 ${card('b','cart',salesM.length,'Ventes sur la période')}${card('c','trend',dh(ca),"Chiffre d'affaires")}
 ${isAdmin()?card('e','trend','<span style="color:var(--'+(pf<0?'bad':'ok')+')">'+dh(pf)+'</span>','Profit sur la période'):''}
 ${card('a','box',products.length,'Produits')}${card('d','box',total,'Articles en stock')}${card('w','alert',out0,'Déclinaisons en rupture')}</div></div>
 ${low.length?`<h2>À réapprovisionner</h2><div class="panel scroll"><table>${low.slice(0,8).map(x=>`<tr><td>${esc(x.p.name)}</td><td>${esc(x.v.variant)}</td><td>${esc(x.v.color)}</td><td class="n"><span class="pill ${x.q<=0?'zero':''}">${x.q}</span></td></tr>`).join('')}</table></div>`:''}
 <h2>Derniers mouvements</h2>${moveTable(recent||[])}`;
}
const MLBL={in:'Entrée',out:'Vente',return:'Retour'};
function moveTable(a){
 if(!a.length)return '<div class="panel empty">Aucun mouvement pour le moment.</div>';
 return `<div class="panel scroll"><table><tr><th>Date</th><th>Type</th><th>Produit</th><th class="n">Qté</th></tr>${a.map(x=>{const p=prodOf(x.variants?.product_id)||prodOf(x.variant_id);return `<tr><td>${fd(x.date)}</td><td>${MLBL[x.type]||x.type}</td><td>${esc(p?.p?.name||'(supprimé)')} · ${esc(x.variants?.variant||'')} · ${esc(x.variants?.color||'')}</td><td class="n ${x.type==='out'?'out':'in'}">${x.type==='out'?'-':'+'}${x.qty}</td></tr>`}).join('')}</table></div>`;
}

/* ---------- Produits ---------- */
const th=p=>p.photo_url?`<img class="th" src="${esc(p.photo_url)}" alt="${esc(p.name)}">`:'<span class="th">📦</span>';
const parseList=s=>{const a=(s||'').split(',').map(x=>x.trim()).filter(Boolean);return a.length?a:['Standard']};
function cbPreview(){
 const V=parseList($('#pv').value),C=parseList($('#pc').value);
 $('#cbx').innerHTML=V.length*C.length>1?'<label>Code-barres de chaque déclinaison (facultatif)</label>'+V.flatMap(v=>C.map(c=>`<div class="scan"><span class="cl">${esc(v)} · ${esc(c)}</span><input class="cbn" data-v="${esc(v)}" data-c="${esc(c)}" placeholder="Scanner ou saisir"></div>`)).join(''):'';
}
function catOptions(sel){return`<select id="pcat" onchange="onCatChange()"><option value="">— Choisir —</option>${categories.map(c=>`<option value="${esc(c.name)}" ${sel===c.name?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`}
function subOptions(catName){const cat=categories.find(c=>c.name===catName);const subs=cat?subcategories.filter(s=>s.category_id===cat.id):[];return`<select id="psub"><option value="">— Aucune —</option>${subs.map(s=>`<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('')}</select>`}
function onCatChange(){const sel=$('#pcat').value;$('#subwrap').innerHTML=subOptions(sel)}
function brandOptions(id){const brands=[...new Set(products.map(p=>p.brand).filter(Boolean))];return`<input list="brandlist" id="${id}" placeholder="Ex. Sophie la Girafe"><datalist id="brandlist">${brands.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>`}
let newPhotoFile=null;
function pickPhotoFile(inp){newPhotoFile=inp.files[0]||null;const r=$('#pphp');if(newPhotoFile){const rd=new FileReader();rd.onload=()=>r.innerHTML=`<img class="th" src="${rd.result}" alt="">`;rd.readAsDataURL(newPhotoFile)}else r.innerHTML=''}
async function uploadPhoto(file,productId){
 const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=`${productId}.${ext}`;
 const{error}=await sb.storage.from('product-photos').upload(path,file,{upsert:true,cacheControl:'3600'});
 if(error){toast('Photo non envoyée : '+error.message);return null}
 return sb.storage.from('product-photos').getPublicUrl(path).data.publicUrl;
}
function toggleSaleField(cb){$('#psaleprice').style.display=cb.checked?'block':'none'}
let bulkRows=[{},{},{}];
function bulkRow(r,i){
 return `<tr>
 <td><input value="${esc(r.name||'')}" oninput="bulkRows[${i}].name=this.value" placeholder="Nom" style="min-width:130px"></td>
 <td><input value="${esc(r.category||'')}" oninput="bulkRows[${i}].category=this.value" placeholder="Catégorie" style="min-width:100px"></td>
 <td><input value="${esc(r.subcategory||'')}" oninput="bulkRows[${i}].subcategory=this.value" placeholder="Sous-cat." style="min-width:100px"></td>
 <td><input value="${esc(r.brand||'')}" oninput="bulkRows[${i}].brand=this.value" placeholder="Marque" style="min-width:100px"></td>
 <td><input value="${esc(r.variant||'')}" oninput="bulkRows[${i}].variant=this.value" placeholder="Taille" style="min-width:80px"></td>
 <td><input value="${esc(r.color||'')}" oninput="bulkRows[${i}].color=this.value" placeholder="Couleur" style="min-width:80px"></td>
 <td><input value="${esc(r.barcode||'')}" oninput="bulkRows[${i}].barcode=this.value" placeholder="Code-barres" style="min-width:110px"></td>
 <td><input type="number" min="0" step="any" value="${r.price??''}" oninput="bulkRows[${i}].price=this.value" placeholder="Prix" style="min-width:70px"></td>
 <td class="n"><input type="checkbox" style="width:auto" ${r.isNew?'checked':''} onchange="bulkRows[${i}].isNew=this.checked"></td>
 <td class="n"><input type="checkbox" style="width:auto" ${r.onSale?'checked':''} onchange="bulkRows[${i}].onSale=this.checked"></td>
 <td><button onclick="bulkRows.splice(${i},1);render(true)">✕</button></td>
 </tr>`;
}
function bulkTable(){
 return `<div class="card"><h2 style="margin-top:0">Ajout rapide (plusieurs produits)</h2><p class="hint" style="margin:0 0 10px">Une ligne = un produit avec une seule déclinaison. Pour un produit à plusieurs tailles/couleurs, utilisez le formulaire ci-dessus.</p>
 <div class="scroll"><table><tr><th>Nom</th><th>Catégorie</th><th>Sous-cat.</th><th>Marque</th><th>Taille</th><th>Couleur</th><th>Code-barres</th><th>Prix</th><th class="n">Nouveau</th><th class="n">Promo</th><th></th></tr>${bulkRows.map(bulkRow).join('')}</table></div>
 <div class="row"><button class="btn ghost" onclick="bulkRows.push({});render(true)">Ajouter une ligne</button><button class="btn" onclick="saveBulk()">Créer ces produits</button></div></div>`;
}
async function saveBulk(){
 const ok=bulkRows.filter(r=>r.name&&r.category&&parseFloat(r.price)>=0);
 if(!ok.length){toast('Complétez au moins une ligne (nom, catégorie, prix)');return}
 let n=0;
 for(const r of ok){
  const{data:p,error}=await sb.from('products').insert({name:r.name.trim(),price:parseFloat(r.price),cost:0,category:r.category.trim(),subcategory:(r.subcategory||'').trim()||null,brand:(r.brand||'').trim()||null,is_new:!!r.isNew,on_sale:!!r.onSale,visible:true}).select().single();
  if(error){toast(error.message);continue}
  await sb.from('variants').insert({product_id:p.id,variant:(r.variant||'Standard').trim()||'Standard',color:(r.color||'Standard').trim()||'Standard',barcode:(r.barcode||'').trim()||null});
  n++;
 }
 bulkRows=[{},{},{}];toast(n+' produit(s) créé(s) 🎉');await refresh()
}
function productsView(){
 const q=prodQ.toLowerCase(),ed=me.role!=='vendeur',ad=isAdmin();
 const c=combos().filter(x=>(x.p.name+x.v.variant+x.v.color+(x.v.barcode||'')+(x.p.category||'')+(x.p.brand||'')).toLowerCase().includes(q));
 return `<h1>${t('products')}</h1><p class="sub">Toutes vos références, avec le stock actuel.</p>
 ${ed?`<div class="card"><h2 style="margin-top:0">${t('add')} un produit</h2>
 <div class="grid"><div><label for="pn">${t('name')} du produit</label><input id="pn"></div>
 <div><label for="pbrand">Marque</label>${brandOptions('pbrand')}</div>
 <div><label for="pb">${t('barcode')}</label><input id="pb" placeholder="Si une seule déclinaison"></div>
 <div><label for="pp">${t('price')} de vente (DH)</label><input id="pp" type="number" min="0" step="any"></div>
 ${ad?`<div><label for="pa">Prix d'achat (DH)</label><input id="pa" type="number" min="0" step="any"></div>`:''}</div>
 <div class="grid"><div><label for="pcat">${t('category')}</label>${catOptions()}</div><div><label for="psub">${t('subcategory')} (facultatif)</label><div id="subwrap">${subOptions()}</div></div></div>
 ${!categories.length?`<p class="hint">Aucune catégorie créée pour l'instant — ajoutez-en dans <a href="#" onclick="go('settings');return false">Paramètres</a>.</p>`:''}
 <div class="grid"><div><label for="pv">Tailles / variantes</label><input id="pv" placeholder="S, M, L" oninput="cbPreview()"></div>
 <div><label for="pc">Couleurs</label><input id="pc" placeholder="Noir, Rose, Bleu" oninput="cbPreview()"></div></div>
 <div id="cbx"></div>
 <div class="grid"><div><label for="pphoto">${t('photo')} (facultatif)</label><input id="pphoto" type="file" accept="image/*" onchange="pickPhotoFile(this)"></div><div><label for="pth">Seuil stock faible</label><input id="pth" type="number" min="0" placeholder="${LOW}"></div></div>
 <div id="pphp" style="margin-bottom:10px"></div>
 <label style="display:flex;gap:8px;align-items:center;font-weight:400;margin:0 0 10px"><input type="checkbox" id="pvis" checked style="width:auto;min-height:auto">Afficher sur le site vitrine</label>
 <label style="display:flex;gap:8px;align-items:center;font-weight:400;margin:0 0 10px"><input type="checkbox" id="pnew" style="width:auto;min-height:auto">Marquer comme nouveauté</label>

async function addProduct(){
 const name=$('#pn').value.trim(),price=parseFloat($('#pp').value),category=$('#pcat').value.trim();
 if(!name||isNaN(price)){toast('Indiquez un nom et un prix');return}
 if(!category){toast('Indiquez une catégorie');return}
 const onSale=$('#psale').checked,salePrice=onSale?(parseFloat($('#pspv').value)||null):null;
 const{data:p,error}=await sb.from('products').insert({name,price,cost:isAdmin()?(parseFloat($('#pa').value)||0):0,category,subcategory:$('#psub').value.trim()||null,brand:$('#pbrand').value.trim()||null,is_new:$('#pnew').checked,on_sale:onSale,sale_price:salePrice,visible:$('#pvis').checked,low_threshold:parseInt($('#pth').value)||null}).select().single();
 if(error){toast(error.message);return}
 if(newPhotoFile){const url=await uploadPhoto(newPhotoFile,p.id);if(url)await sb.from('products').update({photo_url:url}).eq('id',p.id);newPhotoFile=null}
 const V=parseList($('#pv').value),C=parseList($('#pc').value),single=V.length*C.length===1,bc=$('#pb').value.trim();
 const rows=[];
 for(const v of V)for(const c of C){
  const cbInput=[...document.querySelectorAll('.cbn')].find(i=>i.dataset.v===v&&i.dataset.c===c);
  rows.push({product_id:p.id,variant:v,color:c,barcode:(single?bc:(cbInput?cbInput.value.trim():''))||null});
 }
 const{error:e2}=await sb.from('variants').insert(rows);
 if(e2){toast('Produit créé mais erreur sur les déclinaisons : '+e2.message);return}
 toast('Produit ajouté 🎉');await refresh()
}
async function toggleVisible(id,cur){const{error}=await sb.from('products').update({visible:!cur}).eq('id',id);if(error)toast(error.message);await refresh()}
async function toggleFlag(id,field,cur){const{error}=await sb.from('products').update({[field]:!cur}).eq('id',id);if(error)toast(error.message);await refresh()}


/* ---------- Scan (caméra) ---------- */
async function cam(fn){
 if(!('BarcodeDetector' in window)||!navigator.mediaDevices){toast('Caméra non prise en charge ici : tapez le code');return}
 let st;try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){toast('Caméra refusée ou bloquée');return}
 const box=document.createElement('div');box.className='camb';box.innerHTML='<video playsinline muted></video><button class="btn">Fermer</button>';
 document.body.appendChild(box);const v=box.querySelector('video');v.srcObject=st;await v.play();
 const det=new BarcodeDetector();let iv;const stop=()=>{clearInterval(iv);st.getTracks().forEach(t=>t.stop());box.remove()};
 box.querySelector('button').onclick=stop;
 iv=setInterval(async()=>{try{const r=await det.detect(v);if(r.length){stop();window[fn](r[0].rawValue)}}catch(e){}},400)
}
const scanBox=fn=>`<div class="scan"><input id="sc" aria-label="Code-barres" placeholder="Scanner ou saisir un code-barres, puis Entrée" onkeydown="if(event.key==='Enter'){${fn}(this.value);this.value=''}"><button class="btn" onclick="cam('${fn}')">📷 Caméra</button></div>`;

/* ---------- Recherche produit unifiée (nom ou code-barres) ---------- */
function comboOptions(){return products.flatMap(p=>p.variants.map(v=>({vid:v.id,p,v,label:(p.variants.length>1?`${p.name} · ${v.variant}${v.color&&v.color!=='Standard'?' · '+v.color:''}`:p.name)})))}
function resolveCombo(text){text=(text||'').trim();if(!text)return null;const opts=comboOptions();return opts.find(o=>o.v.barcode&&o.v.barcode===text)||opts.find(o=>o.label.toLowerCase()===text.toLowerCase())||null}
async function camFor(kind,i){
 if(!('BarcodeDetector' in window)||!navigator.mediaDevices){toast('Caméra non prise en charge ici : tapez le code');return}
 let st;try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){toast('Caméra refusée ou bloquée');return}
 const box=document.createElement('div');box.className='camb';box.innerHTML='<video playsinline muted></video><button class="btn">Fermer</button>';
 document.body.appendChild(box);const v=box.querySelector('video');v.srcObject=st;await v.play();
 const det=new BarcodeDetector();let iv;const stop=()=>{clearInterval(iv);st.getTracks().forEach(t=>t.stop());box.remove()};
 box.querySelector('button').onclick=stop;
 iv=setInterval(async()=>{try{const r=await det.detect(v);if(r.length){stop();const code=r[0].rawValue;if(kind==='entry')entryBcChange(i,code);else cartBcChange(i,code)}}catch(e){}},400)
}

/* ---------- Entrées ---------- */
async function nextRef(){
 const{data}=await sb.from('moves').select('ref').eq('type','in').not('ref','is',null);
 const nums=(data||[]).map(r=>parseInt((r.ref||'').replace(/\D/g,''))).filter(n=>!isNaN(n));
 return 'Commande'+((nums.length?Math.max(...nums):0)+1);
}
function entryLineFields(i,l){
 const opt=l.vid?comboOptions().find(o=>o.vid===l.vid):null;
 const nameVal=opt?opt.label:(l.nameText||''),bcVal=opt?(opt.v.barcode||''):(l.bcText||'');
 return `<input list="dl_en${i}" placeholder="Nom du produit" value="${esc(nameVal)}" onchange="entryNameChange(${i},this.value)">
 <datalist id="dl_en${i}">${comboOptions().map(o=>`<option value="${esc(o.label)}">`).join('')}</datalist>
 <div class="bcwrap"><input placeholder="Code-barres" value="${esc(bcVal)}" onchange="entryBcChange(${i},this.value)"><button type="button" class="btn ghost" onclick="camFor('entry',${i})">📷</button></div>`;
}
function entryNameChange(i,val){entryLines[i]=entryLines[i]||{};entryLines[i].nameText=val;const m=resolveCombo(val);if(m)entryLines[i].vid=m.vid;else if(val)toast('Produit introuvable');render(true)}
function entryBcChange(i,val){entryLines[i]=entryLines[i]||{};entryLines[i].bcText=val;const f=findByBarcode(val);if(f)entryLines[i].vid=f.v.id;else if(val)toast('Code inconnu');render(true)}
let lastEntryReceipt=null;
async function entries(){
 if(!products.length)return `<h1>${t('entries')}</h1><div class="panel empty">Ajoutez d'abord un produit. <button class="btn" onclick="go('products')">Aller aux produits</button></div>`;
 const suggestedRef=await nextRef();
 const total=entryLines.reduce((s,l)=>s+(parseInt(l.q)||0)*(prodOf(l.vid)?.p.price||0),0);
 return `<h1>${t('entries')}</h1><p class="sub">Réapprovisionnement : indiquez le nom du produit <b>ou</b> son code-barres, l'autre se remplit automatiquement.</p>
 <div class="card">
 <div class="grid"><div><label for="er">${t('reference')} commande</label><input id="er" placeholder="${suggestedRef} (laisser vide = auto)"></div><div><label for="edt">${t('date')}</label><input id="edt" type="date" value="${today()}"></div><div><label for="ef">${t('supplier')}</label><input id="ef"></div><div><label for="edue">Échéance de paiement</label><input id="edue" type="date"></div></div>
 ${entryLines.map((l,i)=>`<div class="line l5">${entryLineFields(i,l)}<input type="number" min="1" placeholder="${t('qty')}" value="${l.q||''}" oninput="entryLines[${i}].q=this.value;render()"><button onclick="entryLines.splice(${i},1);render()">✕</button></div>`).join('')}
 <div class="row"><button class="btn ghost" onclick="entryLines.push({});render()">Ajouter une ligne</button></div>
 <div class="grid"><div><label>Montant calculé</label><input value="${dh(total)}" disabled></div><div><label for="ereal">Montant réel (si remise fournisseur)</label><input id="ereal" type="number" min="0" step="any" placeholder="${Math.round(total)}"></div></div>
 <button class="btn" onclick="saveEntries('${suggestedRef}')">${t('save')} l'entrée</button></div>
 ${lastEntryReceipt?entryReceiptCard():''}`;
}
function entryReceiptCard(){const r=lastEntryReceipt;return `<div class="card" id="receipt"><h2 style="margin-top:0">Reçu d'entrée — ${esc(r.ref)}</h2><p class="hint" style="margin:0 0 10px">${fd(r.date)} · ${esc(r.supplier||'—')} · ${esc(r.by)}</p>
 <div class="panel scroll"><table><tr><th>Article</th><th class="n">Qté</th><th class="n">Total</th></tr>${r.items.map(i=>`<tr><td>${esc(i.name)}</td><td class="n">${i.q}</td><td class="n">${dh(i.price*i.q)}</td></tr>`).join('')}</table></div>
 <div class="total" style="margin-top:10px">Montant calculé : ${dh(r.total)}${r.actual&&r.actual!==r.total?` · Montant réel : ${dh(r.actual)}`:''}</div>
 <div class="row"><button class="btn ghost" onclick="window.print()">Imprimer</button><button class="btn ghost" onclick="lastEntryReceipt=null;render()">Fermer</button></div></div>`}
async function saveEntries(suggestedRef){
 const ok=entryLines.filter(l=>l.vid&&parseInt(l.q)>0);
 if(!ok.length){toast('Complétez au moins une ligne avec un produit reconnu');return}
 const ref=$('#er').value.trim()||suggestedRef,sup=$('#ef').value.trim(),due=$('#edue').value||null,realAmt=parseFloat($('#ereal').value)||null;
 for(const l of ok){
  const pv=prodOf(l.vid);
  const{error}=await sb.rpc('record_move',{p_variant_id:l.vid,p_type:'in',p_qty:parseInt(l.q),p_unit_price:pv?.p.price||0,p_ref:ref,p_supplier:sup,p_payment:null,p_by:me.id,p_due_date:due});
  if(error){toast(error.message);return}
 }
 const total=ok.reduce((s,l)=>s+parseInt(l.q)*(prodOf(l.vid)?.p.price||0),0);
 if(realAmt!==null){await sb.from('purchase_notes').upsert({ref,actual_amount:realAmt,updated_at:new Date().toISOString()})}
 lastEntryReceipt={ref,date:$('#edt').value||today(),supplier:sup,by:me.name,total,actual:realAmt,items:ok.map(l=>({name:prodOf(l.vid)?.p.name+(prodOf(l.vid)?.v.variant!=='Standard'?' — '+prodOf(l.vid)?.v.variant:'')+(prodOf(l.vid)?.v.color&&prodOf(l.vid)?.v.color!=='Standard'?' '+prodOf(l.vid)?.v.color:''),q:parseInt(l.q),price:prodOf(l.vid)?.p.price||0}))};
 entryLines=[{}];toast(ok.length+' ligne(s) ajoutée(s) au stock — montant '+dh(total));await refresh()
}

/* ---------- Ventes ---------- */
function cartLineFields(i,l){
 const opt=l.vid?comboOptions().find(o=>o.vid===l.vid):null;
 const nameVal=opt?opt.label:(l.nameText||''),bcVal=opt?(opt.v.barcode||''):(l.bcText||'');
 return `<input list="dl_cl${i}" placeholder="Nom du produit" value="${esc(nameVal)}" onchange="cartNameChange(${i},this.value)">
 <datalist id="dl_cl${i}">${comboOptions().map(o=>`<option value="${esc(o.label)}">`).join('')}</datalist>
 <div class="bcwrap"><input placeholder="Code-barres" value="${esc(bcVal)}" onchange="cartBcChange(${i},this.value)"><button type="button" class="btn ghost" onclick="camFor('sale',${i})">📷</button></div>`;
}
function cartNameChange(i,val){cart[i]=cart[i]||{};cart[i].nameText=val;const m=resolveCombo(val);if(m){const pv=prodOf(m.vid);cart[i]={vid:m.vid,price:pv?.p.price||0,q:cart[i].q||1}}else if(val)toast('Produit introuvable');render(true)}
function cartBcChange(i,val){cart[i]=cart[i]||{};cart[i].bcText=val;const f=findByBarcode(val);if(f){cart[i]={vid:f.v.id,price:f.p.price,q:cart[i].q||1}}else if(val)toast('Code inconnu');render(true)}
function saleTotals(){const sub=round2(cart.reduce((s,l)=>s+(parseFloat(l.price)||0)*(parseInt(l.q)||0),0)),dv=parseFloat(saleMeta.discVal)||0,dAmt=round2(Math.min(sub,saleMeta.disc==='pct'?sub*dv/100:dv));return{sub,dAmt,total:round2(sub-dAmt)}}
function sales(){
 if(!products.length)return `<h1>${t('sales')}</h1><div class="panel empty">Ajoutez d'abord un produit. <button class="btn" onclick="go('products')">Aller aux produits</button></div>`;
 const tot=saleTotals(),given=parseFloat(saleMeta.given)||0,change=round2(given-tot.total);
 return `<h1>${t('sales')}</h1><p class="sub">Indiquez le nom du produit <b>ou</b> son code-barres, l'autre se remplit automatiquement ; le stock diminue à l'enregistrement.</p>
 <div class="card">
 ${cart.map((l,i)=>`<div class="line l6">${cartLineFields(i,l)}<input type="number" min="1" placeholder="${t('qty')}" value="${l.q||''}" oninput="cart[${i}].q=this.value;render()"><input type="number" min="0" step="any" placeholder="${t('price')}" value="${l.price??''}" oninput="cart[${i}].price=this.value;render()"><button onclick="cart.splice(${i},1);render()">✕</button></div>`).join('')}
 <div class="row"><button class="btn ghost" onclick="cart.push({});render()">Ajouter une ligne</button></div>
 ${cart.length?`<div class="grid"><div><label>Remise</label><div class="row" style="margin:0"><select style="max-width:100px" onchange="saleMeta.disc=this.value;render()"><option value="pct" ${saleMeta.disc==='pct'?'selected':''}>%</option><option value="amt" ${saleMeta.disc==='amt'?'selected':''}>DH</option></select><input type="number" min="0" step="any" value="${saleMeta.discVal}" oninput="saleMeta.discVal=this.value;render()"></div></div>
 <div><label>Mode de paiement</label><div class="seg"><button class="${saleMeta.payment==='cash'?'on':''}" onclick="saleMeta.payment='cash';render()">💵 Cash</button><button class="${saleMeta.payment==='tpe'?'on':''}" onclick="saleMeta.payment='tpe';render()">💳 TPE</button></div></div></div>`:''}
 <div class="total">Sous-total : ${dh(tot.sub)}${tot.dAmt?` · Remise : -${dh(tot.dAmt)}`:''}<br>Total à payer : ${dh(tot.total)}</div>
 ${saleMeta.payment==='cash'?`<div class="grid"><div><label>Montant donné</label><input type="number" min="0" step="any" value="${saleMeta.given}" oninput="saleMeta.given=this.value;render()"></div><div><label>Monnaie à rendre</label><input value="${dh(Math.max(0,change))}" disabled></div></div>${saleMeta.given!==''&&given<tot.total?'<p class="err">Montant donné insuffisant</p>':''}`:''}
 <button class="btn" onclick="saveSale()" ${!cart.length?'disabled':''}>${t('save')} la vente</button></div>
 ${lastReceipt?receiptCard():''}`;
}
async function saveSale(){
 const ok=cart.filter(l=>l.vid&&parseInt(l.q)>0&&parseFloat(l.price)>=0);
 if(!ok.length){toast('Ajoutez au moins un article complet');return}
 const tt=saleTotals(),given=parseFloat(saleMeta.given)||0;
 if(saleMeta.payment==='cash'&&given<tt.total){toast('Montant donné insuffisant');return}
 const items=ok.map(l=>({variant_id:l.vid,qty:parseInt(l.q),price:parseFloat(l.price)}));
 const{data:saleId,error}=await sb.rpc('record_sale',{p_items:items,p_discount_type:saleMeta.disc,p_discount_value:parseFloat(saleMeta.discVal)||0,p_payment:saleMeta.payment,p_given:saleMeta.payment==='cash'?given:null,p_by:me.id});
 if(error){toast(error.message.includes('Stock')?'Stock insuffisant pour un article':error.message);return}
 lastReceipt={id:saleId,date:today(),items:ok.map(l=>({name:prodOf(l.vid)?.p.name,v:prodOf(l.vid)?.v.variant,c:prodOf(l.vid)?.v.color,q:parseInt(l.q),price:round2(parseFloat(l.price)*(tt.sub>0?tt.total/tt.sub:1))})),sub:tt.sub,discAmt:tt.dAmt,total:tt.total,payment:saleMeta.payment,given,change:round2(given-tt.total),by:me.name};
 cart=[];saleMeta={disc:'pct',discVal:'',payment:saleMeta.payment,given:''};toast('Vente enregistrée 🎉');await refresh()
}
function receiptCard(){const r=lastReceipt;return `<div class="card" id="receipt"><h2 style="margin-top:0">Reçu</h2><p class="hint" style="margin:0 0 10px">${fd(r.date)} · ${esc(r.by)}</p>
 <div class="panel scroll"><table><tr><th>Article</th><th class="n">Qté</th><th class="n">Total</th></tr>${r.items.map(i=>`<tr><td>${esc(i.name)} · ${esc(i.v)} · ${esc(i.c)}</td><td class="n">${i.q}</td><td class="n">${dh(i.price*i.q)}</td></tr>`).join('')}</table></div>
 <p class="hint">Sous-total : ${dh(r.sub)}${r.discAmt?` · Remise : -${dh(r.discAmt)}`:''}</p>
 <div class="total">Total payé : ${dh(r.total)} — ${r.payment==='cash'?'Cash':'TPE'}</div>
 ${r.payment==='cash'?`<p class="hint">Donné : ${dh(r.given)} · Monnaie rendue : ${dh(r.change)}</p>`:''}
 <div class="row"><button class="btn ghost" onclick="window.print()">Imprimer</button><button class="btn ghost" onclick="lastReceipt=null;render()">Fermer</button></div></div>`}

function setRetVariant(vid){const pv=prodOf(vid);ret={vid,price:pv?.p.price||0,q:1,cash:true};render()}
async function returns(){
 if(!products.length)return `<h1>Retours</h1><div class="panel empty">Ajoutez d'abord un produit.</div>`;

 return `<h1>Retours</h1><p class="sub">Un client vous rapporte un article : le stock revient, la vente est déduite du CA.</p>

async function saveReturn(){
 const q=parseInt(ret.q),pr=parseFloat(ret.price);
 if(!ret.vid||!(q>0)||isNaN(pr)){toast('Complétez le produit, la quantité et le prix');return}
 const{error}=await sb.rpc('record_move',{p_variant_id:ret.vid,p_type:'return',p_qty:q,p_unit_price:pr,p_ref:null,p_supplier:null,p_payment:ret.cash!==false?'cash':'tpe',p_by:me.id});
 if(error){toast(error.message);return}
 ret={};toast('Retour enregistré, stock mis à jour');await refresh()
}

/* ---------- Caisse ---------- */
async function cash(){
 const{data:cm2}=await sb.from('cash_moves').select('*').order('date',{ascending:false}).limit(30);
 const{data:mv}=await sb.from('moves').select('*, variants(variant,color,product_id)').eq('payment','cash').in('type',['out','return']).order('date',{ascending:false}).limit(30);
 let bal=0;(mv||[]).forEach(x=>bal+=(x.type==='out'?1:-1)*x.qty*x.unit_price);(cm2||[]).forEach(m=>bal+=m.type==='in'?m.amount:-m.amount);bal=round2(bal);
 const list=[...(mv||[]).map(x=>({date:x.date,label:(x.type==='out'?'Vente':'Retour')+' — '+(prodOf(x.variant_id)?.p.name||''),amount:(x.type==='out'?1:-1)*x.qty*x.unit_price})),...(cm2||[]).map(m=>({date:m.date,label:(m.type==='in'?'Cash in':'Cash out')+(m.note?' — '+m.note:''),amount:m.type==='in'?m.amount:-m.amount}))].sort((a,b)=>a.date<b.date?1:-1).slice(0,20);
 return `<h1>Caisse</h1><p class="sub">Suivi du cash physique disponible.</p>
 <div class="ovp"><h2>Solde actuel</h2><div class="ov"><div class="oc" data-t="c"><span class="ic">${ic('wallet')}</span><div><b>${dh(bal)}</b><span>En caisse</span></div></div></div></div>
 <div class="card"><h2 style="margin-top:0">Cash in / Cash out</h2><p class="hint" style="margin:0 0 12px">N'affecte ni le chiffre d'affaires ni le profit.</p>
 <div class="grid"><div><label>Montant (DH)</label><input type="number" min="0" step="any" value="${cm.amount}" oninput="cm.amount=this.value"></div><div><label>Motif</label><input value="${esc(cm.note||'')}" oninput="cm.note=this.value"></div></div>
 <div class="row"><button class="btn" onclick="cashMove('in')">➕ Cash in</button><button class="btn ghost" onclick="cashMove('out')">➖ Cash out</button></div></div>
 <h2>Mouvements récents</h2>${list.length?`<div class="panel scroll"><table><tr><th>Date</th><th>Détail</th><th class="n">Montant</th></tr>${list.map(x=>`<tr><td>${fd(x.date)}</td><td>${esc(x.label)}</td><td class="n ${x.amount<0?'out':'in'}">${x.amount<0?'-':'+'}${dh(Math.abs(x.amount))}</td></tr>`).join('')}</table></div>`:'<div class="panel empty">Aucun mouvement.</div>'}`;
}
async function cashMove(type){const amt=parseFloat(cm.amount);if(!(amt>0)){toast('Indiquez un montant');return}
 const{error}=await sb.from('cash_moves').insert({type,amount:round2(amt),note:(cm.note||'').trim(),by:me.id});
 if(error){toast(error.message);return}
 cm={amount:'',note:''};toast('Mouvement de caisse enregistré');await render()
}

/* ---------- Historique ---------- */
async function history(){
 let q=sb.from('moves').select('*, variants(variant,color,product_id)').order('date',{ascending:false}).order('created_at',{ascending:false}).limit(200);
 if(hist.type!=='all')q=q.eq('type',hist.type);
 const{data}=await q;
 const txt=hist.q.toLowerCase();
 const rows=(data||[]).filter(x=>{const p=prodOf(x.variant_id);return((p?.p.name||'')+(x.variants?.variant||'')+(x.variants?.color||'')).toLowerCase().includes(txt)});
 return `<h1>Historique</h1><p class="sub">Tous les mouvements, du plus récent au plus ancien.</p>
 <div class="row"><input type="search" placeholder="Rechercher" value="${esc(hist.q)}" oninput="hist.q=this.value;go('history')">
 <div class="seg">${[['all','Toutes'],['in','Entrées'],['out','Ventes'],['return','Retours']].map(([k,l])=>`<button class="${hist.type===k?'on':''}" onclick="hist.type='${k}';go('history')">${l}</button>`).join('')}</div></div>${moveTable(rows)}`;
}

/* ---------- Profit ---------- */
let pr={from:'',to:''};
async function profit(){
 if(!pr.from){const t=today();pr={from:t.slice(0,8)+'01',to:t}}
 const{data}=await sb.from('moves').select('*, variants(variant,color,product_id)').in('type',['out','return']).gte('date',pr.from).lte('date',pr.to);
 const outs=data||[],sgn=x=>x.type==='out'?1:-1,rows={};let ca=0,co=0;
 outs.forEach(x=>{const pid=x.variants?.product_id,o=rows[pid]=rows[pid]||{q:0,r:0,c:0},s=sgn(x);o.q+=s*x.qty;o.r+=s*x.qty*x.unit_price;o.c+=s*x.qty*(x.cost||0);ca+=s*x.qty*x.unit_price;co+=s*x.qty*(x.cost||0)});
 const pf=ca-co,mg=ca?Math.round(pf/ca*100):0,card=(t,i,v,l)=>`<div class="oc" data-t="${t}"><span class="ic">${ic(i)}</span><div><b>${v}</b><span>${l}</span></div></div>`;
 const list=Object.entries(rows).sort((a,b)=>(b[1].r-b[1].c)-(a[1].r-a[1].c));
 return `<h1>Profit</h1><p class="sub">Choisissez la période : du … au …</p>
 <div class="card"><div class="grid" style="margin:0"><div><label>Du</label><input type="date" value="${pr.from}" onchange="pr.from=this.value;go('profit')"></div><div><label>Au</label><input type="date" value="${pr.to}" onchange="pr.to=this.value;go('profit')"></div></div></div>
 <div class="ov" style="margin-bottom:14px">${card('c','cart',dh(ca),"Chiffre d'affaires")}${card('a','box',dh(co),"Coût d'achat")}${card('e','trend','<span style="color:var(--'+(pf<0?'bad':'ok')+')">'+dh(pf)+'</span>','Profit')}${card('d','alert',mg+' %','Marge')}</div>
 ${list.length?`<div class="panel scroll"><table><tr><th>Produit</th><th class="n">Vendus (net)</th><th class="n">CA</th><th class="n">Profit</th></tr>${list.map(([id,o])=>{const p=products.find(x=>x.id===id);return `<tr><td>${esc(p?.name||'(supprimé)')}</td><td class="n">${o.q}</td><td class="n">${dh(o.r)}</td><td class="n ${o.r-o.c<0?'out':'in'}">${dh(o.r-o.c)}</td></tr>`}).join('')}</table></div>`:'<div class="panel empty">Aucune vente sur cette période.</div>'}`;
}

/* ---------- Promotions ---------- */
async function promotions(){
 const{data}=await sb.from('promotions').select('*').order('created_at',{ascending:false});
 const list=data||[];
 return `<h1>Promotions</h1><p class="sub">Vos annonces et opérations (Black Friday, soldes…) affichées sur le site vitrine.</p>
 <div class="card"><h2 style="margin-top:0">Nouvelle promotion</h2>
 <div class="grid"><div><label for="mt">Titre</label><input id="mt" placeholder="Black Friday 🔥"></div><div><label for="md">% de remise (indicatif)</label><input id="md" type="number" min="0" max="100"></div></div>
 <div class="grid"><div><label for="ms">Du</label><input id="ms" type="date"></div><div><label for="me2">Au</label><input id="me2" type="date"></div></div>
 <label for="mdesc">Description</label><input id="mdesc" style="margin-bottom:14px" placeholder="Jusqu'à -30% sur tout le magasin !">
 <button class="btn" onclick="addPromo()">Publier</button></div>
 ${list.length?`<div class="panel scroll"><table><tr><th>Titre</th><th>Période</th><th class="n">Actif</th><th class="n"></th></tr>${list.map(m=>`<tr><td>${esc(m.title)}</td><td>${fd(m.starts_at)||'—'} → ${fd(m.ends_at)||'—'}</td><td class="n"><button class="tgsw ${m.active?'on':''}" onclick="togglePromo('${m.id}',${m.active})"></button></td><td class="n"><button class="btn ghost" onclick="delPromo('${m.id}')">Supprimer</button></td></tr>`).join('')}</table></div>`:'<div class="panel empty">Aucune promotion.</div>'}`;
}
async function addPromo(){
 const title=$('#mt').value.trim();if(!title){toast('Indiquez un titre');return}
 const{error}=await sb.from('promotions').insert({title,description:$('#mdesc').value.trim()||null,discount_pct:parseFloat($('#md').value)||null,starts_at:$('#ms').value||null,ends_at:$('#me2').value||null,active:true});
 if(error){toast(error.message);return}
 toast('Promotion publiée 🎉');await render()
}
async function togglePromo(id,cur){await sb.from('promotions').update({active:!cur}).eq('id',id);await render()}
async function delPromo(id){if(confirm('Supprimer cette promotion ?')){await sb.from('promotions').delete().eq('id',id);await render()}}

/* ---------- Avis clients ---------- */
async function reviews(){
 const{data}=await sb.from('reviews').select('*').order('created_at',{ascending:false});
 const list=data||[];
 const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);
 return `<h1>Avis clients</h1><p class="sub">Ajoutez un avis, ou approuvez/modifiez/supprimez ceux laissés par vos clientes et clients.</p>
 <div class="card"><h2 style="margin-top:0">Ajouter un avis</h2>
 <div class="grid"><div><label for="rvn">Nom</label><input id="rvn"></div><div><label for="rvr">Note</label><select id="rvr"><option value="5">★★★★★</option><option value="4">★★★★☆</option><option value="3">★★★☆☆</option><option value="2">★★☆☆☆</option><option value="1">★☆☆☆☆</option></select></div></div>
 <label for="rvc">Commentaire</label><input id="rvc" style="margin-bottom:12px">
 <button class="btn" onclick="addReview()">Publier cet avis</button></div>
 ${list.length?`<div class="panel scroll"><table><tr><th>Client</th><th>Note</th><th>Commentaire</th><th class="n">Publié</th><th class="n"></th></tr>${list.map(r=>`<tr><td><input value="${esc(r.customer_name)}" onchange="editReview('${r.id}','customer_name',this.value)" style="min-width:110px"></td><td><select onchange="editReview('${r.id}','rating',parseInt(this.value))">${[5,4,3,2,1].map(n=>`<option value="${n}" ${r.rating===n?'selected':''}>${stars(n)}</option>`).join('')}</select></td><td><input value="${esc(r.comment||'')}" onchange="editReview('${r.id}','comment',this.value)" style="min-width:160px"></td><td class="n"><button class="tgsw ${r.approved?'on':''}" onclick="toggleReview('${r.id}',${r.approved})"></button></td><td class="n"><button class="btn ghost" onclick="delReview('${r.id}')">Supprimer</button></td></tr>`).join('')}</table></div>`:'<div class="panel empty">Aucun avis pour le moment.</div>'}`;
}
async function addReview(){
 const name=$('#rvn').value.trim();if(!name){toast('Indiquez un nom');return}
 const{error}=await sb.from('reviews').insert({customer_name:name,rating:parseInt($('#rvr').value),comment:$('#rvc').value.trim()||null,approved:true});
 if(error){toast(error.message);return}
 toast('Avis publié 🎉');await render()
}
async function editReview(id,field,val){const{error}=await sb.from('reviews').update({[field]:val}).eq('id',id);if(error)toast(error.message);await render()}
async function toggleReview(id,cur){await sb.from('reviews').update({approved:!cur}).eq('id',id);await render()}
async function delReview(id){if(confirm('Supprimer cet avis ?')){await sb.from('reviews').delete().eq('id',id);await render()}}

/* ---------- Paramètres du site (catégories, sous-catégories) ---------- */
let newCatImg=null;
function pickCatImg(inp){newCatImg=inp.files[0]||null}
async function uploadSiteImage(file,path){
 const{error}=await sb.storage.from('site-images').upload(path,file,{upsert:true,cacheControl:'3600'});
 if(error){toast('Image non envoyée : '+error.message);return null}
 return sb.storage.from('site-images').getPublicUrl(path).data.publicUrl;
}
async function addCategory(){
 const name=$('#newcat').value.trim();if(!name){toast('Indiquez un nom de catégorie');return}
 const{data:c,error}=await sb.from('categories').insert({name}).select().single();
 if(error){toast(error.message);return}
 if(newCatImg){const url=await uploadSiteImage(newCatImg,`cat-${c.id}.${(newCatImg.name.split('.').pop()||'jpg').toLowerCase()}`);if(url)await sb.from('categories').update({image_url:url}).eq('id',c.id);newCatImg=null}
 $('#newcat').value='';toast('Catégorie ajoutée 🎉');await refreshCats()
}
async function delCategory(id){if(confirm('Supprimer cette catégorie et ses sous-catégories ?')){await sb.from('categories').delete().eq('id',id);await refreshCats()}}
async function addSubcategory(catId,inputId){
 const el=document.getElementById(inputId),name=el.value.trim();if(!name){toast('Indiquez un nom');return}
 const{error}=await sb.from('subcategories').insert({category_id:catId,name});
 if(error){toast(error.message);return}
 el.value='';toast('Sous-catégorie ajoutée');await refreshCats()
}
async function delSubcategory(id){await sb.from('subcategories').delete().eq('id',id);await refreshCats()}
function settings(){
 return `<h1>Paramètres du site</h1><p class="sub">Gérez les catégories et sous-catégories proposées lors de la création d'un produit, avec une image par catégorie pour le site.</p>
 <div class="card"><h2 style="margin-top:0">Nouvelle catégorie</h2>
 <div class="grid"><div><label for="newcat">Nom</label><input id="newcat" placeholder="Ex. Bébé"></div><div><label for="newcatimg">Image (facultatif)</label><input id="newcatimg" type="file" accept="image/*" onchange="pickCatImg(this)"></div></div>
 <button class="btn" onclick="addCategory()">Ajouter la catégorie</button></div>
 ${categories.length?categories.map(c=>`<div class="card"><div class="row" style="align-items:center;margin-bottom:10px">${c.image_url?`<img src="${esc(c.image_url)}" alt="" style="width:44px;height:44px;border-radius:10px;object-fit:cover">`:'<span class="th">📦</span>'}<h2 style="margin:0;flex:1">${esc(c.name)}</h2><button class="btn ghost" onclick="delCategory('${c.id}')">Supprimer</button></div>
 <div class="row">${subcategories.filter(s=>s.category_id===c.id).map(s=>`<span class="pill">${esc(s.name)} <a href="#" onclick="delSubcategory('${s.id}');return false" style="color:var(--bad)">✕</a></span>`).join('')||'<span class="hint">Aucune sous-catégorie</span>'}</div>
 <div class="row" style="margin-top:10px"><input id="sub_${c.id}" placeholder="Nouvelle sous-catégorie"><button class="btn ghost" onclick="addSubcategory('${c.id}','sub_${c.id}')">Ajouter</button></div></div>`).join(''):'<div class="panel empty">Aucune catégorie pour le moment.</div>'}`;
}


/* ---------- Utilisateurs ---------- */
async function users(){
 const{data}=await sb.from('profiles').select('*').order('created_at');
 const list=data||[];
 return `<h1>Utilisateurs</h1><p class="sub">Les comptes se créent dans Supabase (Authentication → Add user) ; attribuez ensuite le nom et le rôle ici.</p>
 <div class="panel scroll"><table><tr><th>Nom</th><th>Rôle</th><th class="n"></th></tr>${list.map(u=>`<tr><td><input value="${esc(u.name)}" onchange="renameUser('${u.id}',this.value)" style="min-width:140px"></td><td><select onchange="setRole('${u.id}',this.value)">${Object.entries(ROLE).map(([k,l])=>`<option value="${k}" ${u.role===k?'selected':''}>${l}</option>`).join('')}</select></td><td class="n">${u.id===me.id?'<span class="hint">(vous)</span>':''}</td></tr>`).join('')}</table></div>
 <p class="hint">Vendeur : ventes et consultation. Magasinier : produits et entrées. Administrateur : tout, y compris profit et utilisateurs.</p>`;
}
async function renameUser(id,name){await sb.from('profiles').update({name:name.trim()}).eq('id',id);if(id===me.id)me.name=name.trim();await render()}
async function setRole(id,role){const{error}=await sb.from('profiles').update({role}).eq('id',id);if(error){toast(error.message);return}if(id===me.id)me.role=role;await render()}

boot();
</script>
</body>
