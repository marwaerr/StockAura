<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dh=n=>Math.round(n||0).toLocaleString('fr-FR')+' DH';
const round2=n=>Math.round(n*100)/100;
const today=()=>new Date().toISOString().slice(0,10);
const fd=d=>d?d.split('-').reverse().join('/'):'';
const LOW=5;
const ROLE={admin:'Administrateur',vendeur:'Vendeur',magasinier:'Magasinier'};
const PERM={admin:['menu','home','products','entries','sales','returns','cash','history','profit','site','users'],vendeur:['menu','home','products','sales','returns','cash','history'],magasinier:['menu','home','products','entries','history']};
let session=null, me=null, products=[], view='menu';
let lang=localStorage.getItem('sa_lang')||'fr';
document.documentElement.dir=lang==='ar'?'rtl':'ltr';
try{localStorage.removeItem('sa_theme')}catch(e){}
const TR={
 fr:{menu:'Accueil',home:'Tableau de bord',products:'Produits',entries:'Entrées',sales:'Ventes',returns:'Retours',cash:'Caisse',history:'Historique',profit:'Profit',promotions:'Promotions',users:'Utilisateurs',logout:'Se déconnecter',hello:'Salut',add:'Ajouter',save:'Enregistrer',cancel:'Annuler',search:'Rechercher',name:'Nom',price:'Prix',qty:'Quantité',date:'Date',supplier:'Fournisseur',reference:'Référence',category:'Catégorie',subcategory:'Sous-catégorie',photo:'Photo',product:'Produit',barcode:'Code-barres',stock:'Stock'},
 ar:{menu:'الرئيسية',home:'لوحة القيادة',products:'المنتجات',entries:'المدخلات',sales:'المبيعات',returns:'المرتجعات',cash:'الصندوق',history:'السجل',profit:'الربح',promotions:'العروض',users:'المستخدمون',logout:'تسجيل الخروج',hello:'مرحبا',add:'إضافة',save:'حفظ',cancel:'إلغاء',search:'بحث',name:'الاسم',price:'السعر',qty:'الكمية',date:'التاريخ',supplier:'المورد',reference:'المرجع',category:'الفئة',subcategory:'الفئة الفرعية',photo:'صورة',product:'المنتج',barcode:'الباركود',stock:'المخزون'}
};
const t=k=>TR[lang][k]||TR.fr[k]||k;
function setLang(l){lang=l;localStorage.setItem('sa_lang',l);document.documentElement.dir=l==='ar'?'rtl':'ltr';render()}
const displayName=n=>n&&n.includes('@')?n.split('@')[0]:n;
let hist={type:'all',q:''}, entryLines=[{}], cart=[{}], saleMeta={disc:'pct',discVal:'',payment:'cash',given:''}, lastReceipt=null, ret={}, cm={amount:'',note:''}, prodQ='';

/* ---------- Brouillons de formulaires ---------- */
let drafts={},fileDrafts={};
const NO_DRAFT=/^(cq|cpr|eq)\d+$|^(sdisc|sgiven|sc)$/;
function clearDrafts(){drafts={};fileDrafts={}}
function draftable(el){return el&&el.id&&!NO_DRAFT.test(el.id)&&el.type!=='search'&&!el.disabled&&/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName)}
function recordDraft(e){const el=e.target;if(!draftable(el))return;if(el.type==='file'){fileDrafts[el.id]=[...el.files];return}drafts[el.id]=(el.type==='checkbox'||el.type==='radio')?el.checked:el.value}
document.addEventListener('input',recordDraft,true);document.addEventListener('change',recordDraft,true);
function restoreDrafts(){
 for(const id of Object.keys(drafts)){
  const el=document.getElementById(id);if(!el||!draftable(el)||el.type==='file')continue;
  const v=drafts[id];
  if(el.type==='checkbox'||el.type==='radio'){if(el.checked!==v){el.checked=v;el.dispatchEvent(new Event('change'))}}
  else if(el.value!==v){el.value=v;if(el.tagName==='SELECT'){if(el.onchange)el.onchange()}else if(el.oninput)el.oninput()}
 }
 for(const id of Object.keys(fileDrafts)){
  const el=document.getElementById(id);if(!el||!fileDrafts[id].length)continue;
  try{const dt=new DataTransfer();fileDrafts[id].forEach(f=>dt.items.add(f));el.files=dt.files;if(el.onchange)el.onchange()}catch(e){}
 }
}
function cancelAddProduct(){clearDrafts();newPhotoFile=null;render()}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
function can(v){return me&&PERM[me.role]?.includes(v)}
const isAdmin=()=>me&&me.role==='admin';

/* ---------- Auth ---------- */
async function boot(){
 const {data}=await sb.auth.getSession();
 session=data.session;
 if(session){await loadMe();await checkPendingOrders(true);await checkPendingReviews(true)}
 render();
}
sb.auth.onAuthStateChange(async(e,s)=>{
 const prev=session?.user?.id;session=s;
 if(e==='INITIAL_SESSION'||e==='TOKEN_REFRESHED'||e==='USER_UPDATED')return; // pas de rechargement de l'écran
 if(e==='SIGNED_IN'&&prev&&s&&s.user.id===prev&&me)return; // même utilisateur : on garde la saisie en cours
 if(s){await loadMe();await checkPendingOrders(true);await checkPendingReviews(true)}else{me=null;clearDrafts()}
 render()});
async function loadMe(){
 const{data,error}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
 if(!error)me=data;
}
let pendingOrders=0,pendingReviews=0;
async function checkPendingOrders(notify){
 const{count}=await sb.from('orders').select('id',{count:'exact',head:true}).eq('status','nouveau');
 pendingOrders=count||0;
 if(notify&&pendingOrders>0&&isAdmin())toast(pendingOrders+' nouvelle(s) commande(s) à valider 🛍️');
}
async function checkPendingReviews(notify){
 const{count}=await sb.from('reviews').select('id',{count:'exact',head:true}).eq('approved',false);
 pendingReviews=count||0;
 if(notify&&pendingReviews>0&&isAdmin())toast(pendingReviews+' nouvel(aux) avis à modérer ⭐');
}
async function doLogin(){
 const idf=$('#li').value.trim(),pw=$('#lp').value;
 if(!idf||!pw){toast('Identifiant et mot de passe requis');return}
 const email=idf.includes('@')?idf:idf+'@stockaura.app';
 $('#lbtn').innerHTML='<span class="spin"></span>Connexion…';
 const{error}=await sb.auth.signInWithPassword({email,password:pw});
 if(error){toast('Identifiant ou mot de passe incorrect');$('#lbtn').textContent='Se connecter'}
}
function loginView(){
 return `<div class="login-wrap"><div class="login-brand"><img src="logo.png" alt=""><h1>Ola Bébé 🎉</h1></div><p class="sub">Connectez-vous pour accéder à votre boutique.</p>
 <div class="card"><label for="li">Identifiant</label><input id="li" style="margin-bottom:12px" autocomplete="username">
 <label for="lp">Mot de passe</label><input id="lp" type="password" style="margin-bottom:16px" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
 <button class="btn" id="lbtn" onclick="doLogin()">Se connecter</button></div></div>`;
}
function logout(){sb.auth.signOut()}

/* ---------- Icônes ---------- */
const I={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/>',in:'<path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/>',cart:'<path d="M3 4h2l2 11h11l2-8H6"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.5M3 12h.5M3 18h.5"/>',trend:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',alert:'<path d="M12 3l10 18H2zM12 10v5M12 18v.5"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',wallet:'<path d="M3 7a2 2 0 0 1 2-2h13a1 1 0 0 1 1 1v3M3 7v11a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1h-4a2 2 0 1 0 0 4h5"/>',megaphone:'<path d="M3 11v2a2 2 0 0 0 2 2h1l3 5V6l-3 5H5a2 2 0 0 0-2 2z"/><path d="M11 6l8-3v18l-8-3"/>'};
const ic=n=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

/* ---------- Nav ---------- */
function renderNav(){
 const items=[['menu',t('menu'),'home'],['home',t('home'),'trend'],['products',t('products'),'box'],['entries',t('entries'),'in'],['sales',t('sales'),'cart'],['returns',t('returns'),'in'],['cash',t('cash'),'wallet'],['history',t('history'),'list'],['profit',t('profit'),'trend'],['site','Site','megaphone'],['users',t('users'),'users']].filter(x=>can(x[0]));
 $('#nav').innerHTML='<div class="logo"><img src="logo.png" alt=""><span>Ola Bébé</span></div><div class="me"><i>'+esc(displayName(me.name).slice(0,2).toUpperCase())+'</i><b>'+esc(displayName(me.name))+'</b><span>'+ROLE[me.role]+'</span></div>'
 +items.map(([k,l,i])=>`<button data-c="${k}" class="${view===k?'on':''}" onclick="go('${k}')">${ic(i)}${l}${k==='site'&&(pendingOrders+pendingReviews)>0?`<span class="navbadge">${pendingOrders+pendingReviews}</span>`:''}</button>`).join('')
 +`<div class="spacer"></div>
 <div class="row" style="margin:0 0 8px;gap:6px"><select onchange="setLang(this.value)" style="min-height:32px;padding:2px 6px"><option value="fr" ${lang==='fr'?'selected':''}>FR</option><option value="ar" ${lang==='ar'?'selected':''}>AR</option></select></div>
 <button class="small" onclick="logout()">${t('logout')}</button>`;
}
async function go(v){view=v;await render()}

/* ---------- Data ---------- */
async function loadProducts(){
 const{data,error}=await sb.from('products').select('id,name,price,cost,photo_url,visible,low_threshold,category,subcategory,brand,is_new,on_sale,sale_price,description,product_images(id,image_url),variants(id,variant,color,barcode,quantity)').order('created_at');
 if(error){toast(error.message);return[]}
 return data||[];
}
const combos=()=>products.flatMap(p=>p.variants.map(v=>({p,v,q:v.quantity})));
function findByBarcode(code){code=(code||'').trim();if(!code)return null;for(const p of products)for(const v of p.variants)if(v.barcode===code)return{p,v};return null}
function prodOf(variantId){for(const p of products)for(const v of p.variants)if(v.id===variantId)return{p,v};return null}
let categories=[],subcategories=[],brands=[],departments=[],editingId=null;
async function loadCategories(){
 const[{data:c},{data:s},{data:b},{data:d}]=await Promise.all([sb.from('categories').select('*').order('sort').order('name'),sb.from('subcategories').select('*').order('name'),sb.from('brands').select('*').order('name'),sb.from('departments').select('*').order('sort').order('name')]);
 categories=c||[];subcategories=s||[];brands=b||[];departments=d||[];
}
async function refreshCats(){await loadCategories();await render()}

/* ---------- Rendu principal ---------- */
async function render(){
 document.body.classList.toggle('loggedout',!session||!me);
 if(!session||!me){$('#nav').innerHTML='';$('#main').innerHTML=loginView();return}
 if(!products.length)products=await loadProducts();
 if(!categories.length)await loadCategories();
 if(!can(view))view='menu';
 renderNav();
 const views={menu,home,products:productsView,entries,sales,returns,cash,history,profit,site,users};
 const y=window.scrollY;
 const ae=document.activeElement;
 const keepId=ae&&ae.id?ae.id:null;
 const selStart=keepId&&ae.selectionStart!=null?ae.selectionStart:null;
 const selEnd=keepId&&ae.selectionEnd!=null?ae.selectionEnd:null;
 const html=await views[view]();
 $('#main').innerHTML=html;
 restoreDrafts();
 window.scrollTo(0,y);
 if(keepId){const el=document.getElementById(keepId);if(el){el.focus();if(selStart!=null){try{el.setSelectionRange(selStart,selEnd)}catch(e){}}}}
}
async function refresh(){products=await loadProducts();await render()}

/* ---------- Menu ---------- */
function menu(){
 const items=[['home','Tableau de bord','trend'],['products','Produits','box'],['entries','Entrées','in'],['sales','Ventes','cart'],['returns','Retours','in'],['cash','Caisse','wallet'],['profit','Profit','trend'],['history','Historique','list'],['site','Site','megaphone'],['users','Utilisateurs','users']].filter(x=>can(x[0]));
 return `<h1>${t('hello')} ${esc(displayName(me.name))} 👋</h1><p class="sub">Que voulez-vous faire ?</p>
 <div class="menu">${items.map(([k,l,i],idx)=>`<button class="mtile c${idx%6}" onclick="go('${k}')">${ic(i)}<span>${l}</span></button>`).join('')}</div>`;
}

/* ---------- Tableau de bord ---------- */
let hp=null;
function setPreset(k){const t=new Date(),to=today();let f=to;if(k==='week'){const d=new Date(t);d.setDate(d.getDate()-6);f=d.toISOString().slice(0,10)}if(k==='month')f=to.slice(0,8)+'01';if(k==='year')f=to.slice(0,5)+'01-01';hp={from:f,to,k};go('home')}
async function home(){
 if(!products.length)return `<h1>${t('hello')} ${esc(displayName(me.name))} 👋</h1><p class="sub">Ajoutez un produit, une entrée, puis vendez : le stock se met à jour tout seul.</p><div class="card"><button class="btn" onclick="go('products')">Ajouter mon premier produit</button></div>`;
 if(!hp){const t=today();hp={from:t.slice(0,8)+'01',to:t,k:'month'}}
 const{data:moves}=await sb.from('moves').select('*, variants(variant,color,product_id)').gte('date',hp.from).lte('date',hp.to);
 const m=moves||[],sgn=x=>x.type==='out'?1:-1,trans=m.filter(x=>x.type==='out'||x.type==='return'),salesM=m.filter(x=>x.type==='out');
 const ca=trans.reduce((s,x)=>s+sgn(x)*x.qty*x.unit_price,0),pf=trans.reduce((s,x)=>s+sgn(x)*x.qty*(x.unit_price-(x.cost||0)),0);
 const c=combos(),total=c.reduce((s,x)=>s+x.q,0),low=c.filter(x=>x.q<=(x.p.low_threshold||LOW)),out0=c.filter(x=>x.q<=0).length;
 const top={};trans.forEach(x=>{const pid=x.variants?.product_id;if(!pid)return;const sg=sgn(x);const o=top[pid]=top[pid]||{q:0,r:0};o.q+=sg*x.qty;o.r+=sg*x.qty*x.unit_price});
 const topList=Object.entries(top).filter(([,o])=>o.q>0).sort((a,b)=>b[1].q-a[1].q).slice(0,5);
 const card=(t,i,v,l)=>`<div class="oc" data-t="${t}"><span class="ic">${ic(i)}</span><div><b>${v}</b><span>${l}</span></div></div>`;
 const presets=[['day',"Aujourd'hui"],['week','7 jours'],['month','Ce mois'],['year','Cette année']];
 const{data:recent}=await sb.from('moves').select('*, variants(variant,color,product_id)').order('date',{ascending:false}).order('created_at',{ascending:false}).limit(6);
 return `<h1>${t('hello')} ${esc(displayName(me.name))} 👋</h1><p class="sub">Voici où en est votre boutique.</p>
 <div class="per"><div class="seg">${presets.map(([k,l])=>`<button class="${hp.k===k?'on':''}" onclick="setPreset('${k}')">${l}</button>`).join('')}</div>
 <label>Du <input type="date" value="${hp.from}" onchange="hp.from=this.value;hp.k='';go('home')"></label><label>Au <input type="date" value="${hp.to}" onchange="hp.to=this.value;hp.k='';go('home')"></label></div>
 <div class="ovp"><h2>Aperçu</h2><div class="ov">
 ${card('b','cart',salesM.length,'Ventes sur la période')}${card('c','trend',dh(ca),"Chiffre d'affaires")}
 ${isAdmin()?card('e','trend','<span style="color:var(--'+(pf<0?'bad':'ok')+')">'+dh(pf)+'</span>','Profit sur la période'):''}
 ${card('a','box',products.length,'Produits')}${card('d','box',total,'Articles en stock')}${card('w','alert',out0,'Déclinaisons en rupture')}</div></div>
 ${low.length?`<h2>À réapprovisionner</h2><div class="panel scroll"><table>${low.slice(0,8).map(x=>`<tr><td>${esc(x.p.name)}</td><td>${esc(x.v.variant)}</td><td>${esc(x.v.color)}</td><td class="n"><span class="pill ${x.q<=0?'zero':''}">${x.q}</span></td></tr>`).join('')}</table></div>`:''}
 <h2>Top 5 produits (sur la période)</h2>${topList.length?`<div class="panel scroll"><table><tr><th>Produit</th><th class="n">Unités vendues</th><th class="n">Chiffre d'affaires</th></tr>${topList.map(([pid,o],i)=>`<tr><td>${i+1}. ${esc(products.find(p=>p.id===pid)?.name||'(supprimé)')}</td><td class="n">${o.q}</td><td class="n">${dh(o.r)}</td></tr>`).join('')}</table></div>`:'<div class="panel empty">Aucune vente sur cette période.</div>'}
 <h2>Derniers mouvements</h2>${moveTable(recent||[])}`;
}
const MLBL={in:'Entrée',out:'Vente',return:'Retour'};
function moveTable(a,withReceipt){
 if(!a.length)return '<div class="panel empty">Aucun mouvement pour le moment.</div>';
 const showAmt=isAdmin();
 return `<div class="panel scroll"><table><tr><th>Date</th><th>Type</th><th>Produit</th><th class="n">Qté</th>${showAmt?'<th class="n">Montant</th>':''}${withReceipt?'<th class="n"></th>':''}</tr>${a.map(x=>{const p=prodOf(x.variants?.product_id)||prodOf(x.variant_id);return `<tr><td>${fd(x.date)}</td><td>${MLBL[x.type]||x.type}</td><td>${esc(p?.p?.name||'(supprimé)')} · ${esc(x.variants?.variant||'')} · ${esc(x.variants?.color||'')}</td><td class="n ${x.type==='out'?'out':'in'}">${x.type==='out'?'-':'+'}${x.qty}</td>${showAmt?`<td class="n">${dh(x.qty*x.unit_price)}</td>`:''}${withReceipt?`<td class="n">${x.type==='out'&&x.sale_id?`<button class="btn ghost" onclick="viewReceipt('${x.sale_id}')">Reçu</button>`:''}</td>`:''}</tr>`}).join('')}</table></div>`;
}
async function viewReceipt(saleId){
 const[{data:saleRow},{data:items}]=await Promise.all([
  sb.from('sales').select('*').eq('id',saleId).single(),
  sb.from('moves').select('*, variants(variant,color,product_id)').eq('sale_id',saleId)
 ]);
 if(!saleRow||!items||!items.length){toast('Reçu introuvable');return}
 let byName='';
 if(items[0]?.by){const{data:prof}=await sb.from('profiles').select('name').eq('id',items[0].by).single();byName=prof?.name||''}
 lastReceipt={id:saleId,date:saleRow.date,by:byName,sub:saleRow.subtotal,discAmt:saleRow.discount_amount,total:saleRow.total,payment:saleRow.payment,given:saleRow.given,change:saleRow.change,
  items:items.map(i=>({name:products.find(p=>p.id===i.variants?.product_id)?.name||'(supprimé)',v:i.variants?.variant||'',c:i.variants?.color||'',q:i.qty,price:i.unit_price}))};
 view='sales';await render()
}

/* ---------- Produits ---------- */
const th=p=>p.photo_url?`<img class="th" src="${esc(p.photo_url)}" alt="${esc(p.name)}">`:'<span class="th">📦</span>';
const parseList=s=>{const a=(s||'').split(',').map(x=>x.trim()).filter(Boolean);return a.length?a:['Standard']};
function cbPreview(){
 const V=parseList($('#pv').value),C=parseList($('#pc').value);
 $('#cbx').innerHTML=V.length*C.length>1?'<label>Code-barres de chaque déclinaison (facultatif)</label>'+V.flatMap(v=>C.map(c=>`<div class="scan"><span class="cl">${esc(v)} · ${esc(c)}</span><input class="cbn" id="cbn_${esc(v)}_${esc(c)}" data-v="${esc(v)}" data-c="${esc(c)}" placeholder="Scanner ou saisir"></div>`)).join(''):'';
}
function catOptions(sel){
 const groups=departments.map(d=>`<optgroup label="${esc(d.name)}">${categories.filter(c=>c.department_id===d.id).map(c=>`<option value="${esc(c.name)}" ${sel===c.name?'selected':''}>${esc(c.name)}</option>`).join('')}</optgroup>`).join('');
 const orphans=categories.filter(c=>!c.department_id).map(c=>`<option value="${esc(c.name)}" ${sel===c.name?'selected':''}>${esc(c.name)}</option>`).join('');
 return`<select id="pcat" onchange="onCatChange()"><option value="">— Choisir —</option>${groups}${orphans}</select>`;
}
function subOptions(catName){const cat=categories.find(c=>c.name===catName);const subs=cat?subcategories.filter(s=>s.category_id===cat.id):[];return`<select id="psub"><option value="">— Aucune —</option>${subs.map(s=>`<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('')}</select>`}
function onCatChange(){const sel=$('#pcat').value;$('#subwrap').innerHTML=subOptions(sel)}
function deptSelectOptions(sel){return `<option value="">— Choisir —</option>`+departments.map(d=>`<option value="${d.id}" ${sel===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}
function catOptionsForDept(deptId,sel){
 const cs=deptId?categories.filter(c=>c.department_id===deptId):categories.filter(c=>!c.department_id);
 return `<select id="pcat" onchange="onCatChange()"><option value="">— Choisir —</option>${cs.map(c=>`<option value="${esc(c.name)}" ${sel===c.name?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`;
}
function onDeptChange(){$('#catwrap2').innerHTML=catOptionsForDept($('#pdept').value,'');onCatChange()}
function brandOptions(id){return`<select id="${id}"><option value="">— Choisir —</option>${brands.map(b=>`<option value="${esc(b.name)}">${esc(b.name)}</option>`).join('')}</select>`}
let newPhotoFile=null;
function pickPhotoFile(inp){newPhotoFile=inp.files[0]||null;const r=$('#pphp');if(newPhotoFile){const rd=new FileReader();rd.onload=()=>r.innerHTML=`<img class="th" src="${rd.result}" alt="">`;rd.readAsDataURL(newPhotoFile)}else r.innerHTML=''}
async function uploadPhoto(file,productId){
 const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=`${productId}.${ext}`;
 const{error}=await sb.storage.from('product-photos').upload(path,file,{upsert:true,cacheControl:'3600'});
 if(error){toast('Photo non envoyée : '+error.message);return null}
 return sb.storage.from('product-photos').getPublicUrl(path).data.publicUrl;
}

async function saveBulk(){
 const ok=bulkRows.filter(r=>r.name&&r.category&&parseFloat(r.price)>=0);
 if(!ok.length){toast('Complétez au moins une ligne (nom, catégorie, prix)');return}
 let n=0;
 for(const r of ok){
  const{data:p,error}=await sb.from('products').insert({name:r.name.trim(),price:parseFloat(r.price),cost:0,category:r.category.trim(),subcategory:(r.subcategory||'').trim()||null,brand:(r.brand||'').trim()||null,is_new:!!r.isNew,on_sale:!!r.onSale,visible:true}).select().single();
  if(error){toast(error.message);continue}
  await sb.from('variants').insert({product_id:p.id,variant:(r.variant||'Standard').trim()||'Standard',color:(r.color||'Standard').trim()||'Standard',barcode:(r.barcode||'').trim()||null});
  n++;
 }
 bulkRows=[{},{},{}];toast(n+' produit(s) créé(s) 🎉');await refresh()
}

async function delProduct(id){
 const p=products.find(x=>x.id===id);if(!p)return;
 if(!confirm(`Supprimer définitivement « ${p.name} » et toutes ses déclinaisons ?`))return;
 const vids=p.variants.map(v=>v.id);
 if(vids.length){
  const[{count:c1},{count:c2}]=await Promise.all([
   sb.from('moves').select('id',{count:'exact',head:true}).in('variant_id',vids),
   sb.from('order_items').select('id',{count:'exact',head:true}).in('variant_id',vids)]);
  if(c1||c2){
   if(confirm(`« ${p.name} » a déjà un historique (entrées, ventes ou commandes du site). Le supprimer fausserait vos chiffres et vos reçus.\n\nVoulez-vous plutôt le masquer du site ? Il restera dans vos statistiques.`)){
    const{error}=await sb.from('products').update({visible:false}).eq('id',id);
    if(error){toast(error.message);return}
    toast('Produit masqué du site');await refresh()
   }
   return
  }
 }
 await sb.from('promotion_products').delete().eq('product_id',id);
 await sb.from('product_images').delete().eq('product_id',id);
 if(vids.length){const{error:ev}=await sb.from('variants').delete().in('id',vids);if(ev){toast('Suppression impossible : '+ev.message);return}}
 const{error}=await sb.from('products').delete().eq('id',id);
 if(error){toast('Suppression impossible : '+error.message);return}
 if(editingId===id){editingId=null;clearDrafts()}
 toast('Produit supprimé 🗑');await refresh()
}
async function saveEdit(id){
 const name=$('#ename').value.trim(),price=parseFloat($('#eprice').value);
 if(!name||isNaN(price)){toast('Nom et prix requis');return}
 const onSale=$('#esale').checked;
 const patch={name,price,category:$('#ecat').value,subcategory:$('#esub').value||null,brand:$('#ebrand').value||null,description:$('#edesc').value.trim()||null,low_threshold:parseInt($('#ethresh').value)||null,visible:$('#evis').checked,is_new:$('#enew').checked,on_sale:onSale,sale_price:onSale?(parseFloat($('#esalepv').value)||null):null};
 if(isAdmin())patch.cost=parseFloat($('#ecost').value)||0;
 const{error}=await sb.from('products').update(patch).eq('id',id);
 if(error){toast(error.message);return}
 const f=$('#ephoto').files[0];
 if(f){const url=await uploadPhoto(f,id);if(url)await sb.from('products').update({photo_url:url}).eq('id',id)}
 editingId=null;clearDrafts();toast('Produit mis à jour 🎉');await refresh()
}
async function uploadGalleryPhoto(file,productId){
 const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=`${productId}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
 const{error}=await sb.storage.from('product-photos').upload(path,file,{upsert:true,cacheControl:'3600'});
 if(error){toast('Photo non envoyée : '+error.message);return null}
 return sb.storage.from('product-photos').getPublicUrl(path).data.publicUrl;
}
async function addGalleryImages(id){
 const files=[...($('#egallery').files||[])];
 if(!files.length){toast('Choisissez au moins une photo');return}
 for(const f of files){const url=await uploadGalleryPhoto(f,id);if(url)await sb.from('product_images').insert({product_id:id,image_url:url})}
 clearDrafts();toast('Photos ajoutées 🎉');await refresh()
}
async function delProductImage(imgId){await sb.from('product_images').delete().eq('id',imgId);await refresh()}
async function addProduct(){
 const name=$('#pn').value.trim(),price=parseFloat($('#pp').value),category=$('#pcat').value.trim();
 if(!name||isNaN(price)){toast('Indiquez un nom et un prix');return}
 if(!category){toast('Indiquez une catégorie');return}
 const onSale=$('#psale').checked,salePrice=onSale?(parseFloat($('#pspv').value)||null):null;
 const{data:p,error}=await sb.from('products').insert({name,price,cost:isAdmin()?(parseFloat($('#pa').value)||0):0,category,subcategory:$('#psub').value.trim()||null,brand:$('#pbrand').value.trim()||null,description:$('#pdesc').value.trim()||null,is_new:$('#pnew').checked,on_sale:onSale,sale_price:salePrice,visible:$('#pvis').checked,low_threshold:parseInt($('#pth').value)||null}).select().single();
 if(error){toast(error.message);return}
 if(newPhotoFile){const url=await uploadPhoto(newPhotoFile,p.id);if(url)await sb.from('products').update({photo_url:url}).eq('id',p.id);newPhotoFile=null}
 const galleryFiles=[...($('#pgallery').files||[])];
 for(const f of galleryFiles){const url=await uploadGalleryPhoto(f,p.id);if(url)await sb.from('product_images').insert({product_id:p.id,image_url:url})}
 const V=parseList($('#pv').value),C=parseList($('#pc').value),single=V.length*C.length===1,bc=$('#pb').value.trim();
 const rows=[];
 for(const v of V)for(const c of C){
  const cbInput=[...document.querySelectorAll('.cbn')].find(i=>i.dataset.v===v&&i.dataset.c===c);
  rows.push({product_id:p.id,variant:v,color:c,barcode:(single?bc:(cbInput?cbInput.value.trim():''))||null});
 }
 const{error:e2}=await sb.from('variants').insert(rows);
 if(e2){toast('Produit créé mais erreur sur les déclinaisons : '+e2.message);return}
 clearDrafts();toast('Produit ajouté 🎉');await refresh()
}
async function toggleVisible(id,cur){
 const{error}=await sb.from('products').update({visible:!cur}).eq('id',id);
 if(error){toast(error.message);await render();return}
 const p=products.find(x=>x.id===id);if(p)p.visible=!cur;
 await render();
}
async function toggleFlag(id,field,cur){
 const{error}=await sb.from('products').update({[field]:!cur}).eq('id',id);
 if(error){toast(error.message);await render();return}
 const p=products.find(x=>x.id===id);if(p)p[field]=!cur;
 await render();
}


/* ---------- Scan (caméra) ---------- */
async function cam(fn){
 if(!('BarcodeDetector' in window)||!navigator.mediaDevices){toast('Caméra non prise en charge ici : tapez le code');return}
 let st;try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){toast('Caméra refusée ou bloquée');return}
 const box=document.createElement('div');box.className='camb';box.innerHTML='<video playsinline muted></video><button class="btn">Fermer</button>';
 document.body.appendChild(box);const v=box.querySelector('video');v.srcObject=st;await v.play();
 const det=new BarcodeDetector();let iv;const stop=()=>{clearInterval(iv);st.getTracks().forEach(t=>t.stop());box.remove()};
 box.querySelector('button').onclick=stop;
 iv=setInterval(async()=>{try{const r=await det.detect(v);if(r.length){stop();window[fn](r[0].rawValue)}}catch(e){}},400)
}
const scanBox=fn=>`<div class="scan"><input id="sc" aria-label="Code-barres" placeholder="Scanner ou saisir un code-barres, puis Entrée" onkeydown="if(event.key==='Enter'){${fn}(this.value);this.value=''}"><button class="btn" onclick="cam('${fn}')">📷 Caméra</button></div>`;

/* ---------- Recherche produit unifiée (nom ou code-barres) ---------- */
function comboOptions(){return products.flatMap(p=>p.variants.map(v=>({vid:v.id,p,v,label:(p.variants.length>1?`${p.name} · ${v.variant}${v.color&&v.color!=='Standard'?' · '+v.color:''}`:p.name)})))}
function resolveCombo(text){text=(text||'').trim();if(!text)return null;const opts=comboOptions();return opts.find(o=>o.v.barcode&&o.v.barcode===text)||opts.find(o=>o.label.toLowerCase()===text.toLowerCase())||null}
async function camFor(kind,i){
 if(!('BarcodeDetector' in window)||!navigator.mediaDevices){toast('Caméra non prise en charge ici : tapez le code');return}
 let st;try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){toast('Caméra refusée ou bloquée');return}
 const box=document.createElement('div');box.className='camb';box.innerHTML='<video playsinline muted></video><button class="btn">Fermer</button>';
 document.body.appendChild(box);const v=box.querySelector('video');v.srcObject=st;await v.play();

 if(error){toast(error.message.includes('Stock')?'Stock insuffisant pour un article':error.message);return}
 lastReceipt={id:saleId,date:today(),items:ok.map(l=>({name:prodOf(l.vid)?.p.name,v:prodOf(l.vid)?.v.variant,c:prodOf(l.vid)?.v.color,q:parseInt(l.q),price:round2(parseFloat(l.price)*(tt.sub>0?tt.total/tt.sub:1))})),sub:tt.sub,discAmt:tt.dAmt,total:tt.total,payment:saleMeta.payment,given,change:round2(given-tt.total),by:me.name};

async function setOrderStatus(id,status){
 const{data:order}=await sb.from('orders').select('*').eq('id',id).single();
 if(!order){toast('Commande introuvable');return}
 const shouldDeduct=(status==='confirmee'||status==='livree')&&!order.stock_deducted;
 const shouldRestore=status==='annulee'&&order.stock_deducted;
 if(shouldDeduct||shouldRestore){
  const{data:items}=await sb.from('order_items').select('*').eq('order_id',id);
  for(const it of items||[]){
   const pv=prodOf(it.variant_id);if(!pv)continue;
   const newQty=shouldDeduct?pv.v.quantity-it.qty:pv.v.quantity+it.qty;
   await sb.from('variants').update({quantity:newQty}).eq('id',it.variant_id);
   pv.v.quantity=newQty;
   await sb.from('moves').insert({type:shouldDeduct?'out':'return',variant_id:it.variant_id,qty:it.qty,unit_price:it.unit_price,cost:pv.p.cost||0,payment:null,ref:shouldDeduct?'Commande site':'Commande site annulée',by:me.id});
  }
 }
 const{error}=await sb.from('orders').update({status,stock_deducted:shouldDeduct?true:(shouldRestore?false:order.stock_deducted)}).eq('id',id);
 if(error){toast(error.message);return}
 toast(shouldDeduct?'Statut mis à jour — stock déduit 📦':shouldRestore?'Commande annulée — stock remis à jour':'Statut mis à jour');
 await checkPendingOrders(false);await refresh()
}

 <div class="card"><h2 style="margin-top:0">Nouveau rayon</h2>
 <div class="row"><input id="newdept" placeholder="Ex. Bébé"><button class="btn" onclick="addDepartment()">Ajouter</button></div></div>
 ${departments.length?`<div class="panel scroll"><table><tr><th>Nom</th><th class="n">Catégories</th><th class="n"></th></tr>${departments.map(d=>editingDept===d.id
  ?`<tr style="background:var(--bg)"><td><input id="edn" value="${esc(d.name)}" style="min-width:160px" onkeydown="if(event.key==='Enter')saveDept('${d.id}')"></td><td class="n">${categories.filter(c=>c.department_id===d.id).length}</td><td class="n"><button class="btn" onclick="saveDept('${d.id}')">Enregistrer</button> <button class="btn ghost" onclick="clearDrafts();editingDept=null;render(true)">Annuler</button></td></tr>`
  :`<tr><td><b>${esc(d.name)}</b></td><td class="n">${categories.filter(c=>c.department_id===d.id).length}</td><td class="n"><button class="btn ghost" onclick="editDept('${d.id}')">✏️ Modifier</button> <button class="btn ghost" onclick="delDepartment('${d.id}')">Supprimer</button></td></tr>`).join('')}</table></div>`:'<div class="panel empty">Aucun rayon pour le moment.</div>'}`;
}
function categoryCard(c){
 const dname=departments.find(d=>d.id===c.department_id)?.name;
 const img=c.image_url?`<img src="${esc(c.image_url)}" alt="" style="width:52px;height:52px;border-radius:12px;object-fit:cover">`:'<span class="th" style="width:52px;height:52px">📦</span>';
 const head=editingCat===c.id
  ?`<div style="border:2px solid var(--acc);border-radius:12px;padding:14px;margin-bottom:12px"><h3 style="margin:0 0 12px">Modifier la catégorie</h3>
   <div class="grid"><div><label for="ecn">Nom</label><input id="ecn" value="${esc(c.name)}"></div><div><label for="ecd">Rayon</label><select id="ecd"><option value="">— Sans rayon —</option>${departments.map(d=>`<option value="${d.id}" ${c.department_id===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div></div>
   <div class="row" style="align-items:flex-end"><div><label>Image actuelle</label>${img}</div><div style="flex:1;min-width:180px"><label for="eci">Nouvelle image (facultatif)</label><input id="eci" type="file" accept="image/*" onchange="pickEditCatImg(this)"></div><div id="ecip"></div></div>
   <div class="row" style="margin:0"><button class="btn" onclick="saveCat('${c.id}')">Enregistrer</button><button class="btn ghost" onclick="clearDrafts();editingCat=null;render(true)">Annuler</button></div></div>`
  :`<div class="row" style="align-items:center;margin-bottom:10px">${img}
   <div style="flex:1;min-width:120px"><b style="font-size:17px">${esc(c.name)}</b><br><span class="hint" style="margin:0">${dname?'Rayon : '+esc(dname):'Sans rayon'}</span></div>
   <button class="btn ghost" onclick="editCat('${c.id}')">✏️ Modifier</button><button class="btn ghost" onclick="delCategory('${c.id}')">Supprimer</button></div>`;
 return `<div class="card">${head}
 <label style="margin-bottom:8px">Sous-catégories</label>
 <div class="row">${subcatChips(c.id)}</div>
 <div class="row" style="margin-top:10px"><input id="sub_${c.id}" placeholder="Nouvelle sous-catégorie"><button class="btn ghost" onclick="addSubcategory('${c.id}','sub_${c.id}')">Ajouter</button></div></div>`;
}
function subcatChips(catId){
 const subs=subcategories.filter(s=>s.category_id===catId);
 if(!subs.length)return'<span class="hint">Aucune sous-catégorie</span>';
 return subs.map(subChip).join('');
}
function subChip(s){
 if(editingSub===s.id)return `<span style="display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap"><input id="esn" value="${esc(s.name)}" style="width:180px;min-height:36px" onkeydown="if(event.key==='Enter')saveSub('${s.id}')"><button class="btn" style="padding:7px 12px" onclick="saveSub('${s.id}')">Enregistrer</button><button class="btn ghost" style="padding:7px 12px" onclick="clearDrafts();editingSub=null;render(true)">Annuler</button></span>`;
 return `<span class="pill" style="display:inline-flex;align-items:center;gap:8px;padding:5px 6px 5px 12px;font-size:14px">${esc(s.name)}<button onclick="editSub('${s.id}')" title="Modifier" aria-label="Modifier ${esc(s.name)}" style="all:unset;cursor:pointer;padding:0 4px">✏️</button><button onclick="delSubcategory('${s.id}')" title="Supprimer" aria-label="Supprimer ${esc(s.name)}" style="all:unset;cursor:pointer;padding:0 4px;color:var(--bad);font-weight:800">✕</button></span>`;
}
function deptOptions(){return departments.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}
function catTab(){
 const byDept=departments.map(d=>{
  const cs=categories.filter(c=>c.department_id===d.id);
  if(!cs.length)return'';
  return `<h3 style="margin:20px 0 10px">${esc(d.name)}</h3>`+cs.map(categoryCard).join('');
 }).join('');
 const orphans=categories.filter(c=>!c.department_id);
 const orphanBlock=orphans.length?`<h3 style="margin:20px 0 10px">Sans rayon</h3>`+orphans.map(categoryCard).join(''):'';
 return `<div class="card"><h2 style="margin-top:0">Nouvelle catégorie</h2>
 <div class="grid"><div><label for="newcat">Nom</label><input id="newcat" placeholder="Ex. Biberons"></div><div><label for="newcatdept">Rayon</label><select id="newcatdept">${deptOptions()}</select></div></div>
 <div><label for="newcatimg">Image (facultatif)</label><input id="newcatimg" type="file" accept="image/*" onchange="pickCatImg(this)"></div>
 ${!departments.length?`<p class="hint">Créez d'abord un rayon dans l'onglet "Rayons".</p>`:`<button class="btn" onclick="addCategory()" style="margin-top:12px">Ajouter la catégorie</button>`}</div>
 ${byDept}${orphanBlock}
 ${!categories.length?'<div class="panel empty">Aucune catégorie pour le moment.</div>':''}`;
}

/* ---------- Marques ---------- */
let newBrandLogo=null;
function pickBrandLogo(inp){newBrandLogo=inp.files[0]||null}
async function addBrand(){
 const name=$('#newbrand').value.trim();if(!name){toast('Indiquez un nom de marque');return}
 const{data:b,error}=await sb.from('brands').insert({name}).select().single();
 if(error){toast(error.message);return}
 if(newBrandLogo){const url=await uploadSiteImage(newBrandLogo,`brand-${b.id}.${(newBrandLogo.name.split('.').pop()||'jpg').toLowerCase()}`);if(url)await sb.from('brands').update({logo_url:url}).eq('id',b.id);newBrandLogo=null}
 $('#newbrand').value='';clearDrafts();toast('Marque ajoutée 🎉');await refreshCats()
}
async function renameBrand(id,name){
 name=name.trim();if(!name){toast('Le nom ne peut pas être vide');return}
 const old=brands.find(b=>b.id===id);
 const{error}=await sb.from('brands').update({name}).eq('id',id);
 if(error){toast(error.message);return}
 if(old&&old.name!==name)await sb.from('products').update({brand:name}).eq('brand',old.name);
 await refreshCats();await refresh()
}
async function setBrandLogo(id,inp){const f=inp.files[0];if(!f)return;const url=await uploadSiteImage(f,`brand-${id}.${(f.name.split('.').pop()||'jpg').toLowerCase()}`);if(url){await sb.from('brands').update({logo_url:url}).eq('id',id);await refreshCats()}}
async function delBrand(id){if(confirm('Supprimer cette marque ?')){await sb.from('brands').delete().eq('id',id);await refreshCats()}}
let editingBrand=null,editBrandLogo=null;
function editBrand(id){clearDrafts();editingBrand=editingBrand===id?null:id;editBrandLogo=null;render(true)}
function pickEditBrandLogo(inp){editBrandLogo=inp.files[0]||null;const r=$('#eblp');if(!r)return;if(editBrandLogo){const rd=new FileReader();rd.onload=()=>r.innerHTML=`<img src="${rd.result}" alt="" style="height:80px;max-width:200px;object-fit:contain;border-radius:10px;background:var(--bg);padding:6px">`;rd.readAsDataURL(editBrandLogo)}}
async function saveBrand(id){
 const b=brands.find(x=>x.id===id);if(!b)return;
 const name=$('#ebn').value.trim();if(!name){toast('Le nom ne peut pas être vide');return}
 const patch={};
 if(name!==b.name)patch.name=name;
 if(editBrandLogo){const url=await uploadSiteImage(editBrandLogo,`brand-${id}-${Date.now()}.${(editBrandLogo.name.split('.').pop()||'jpg').toLowerCase()}`);if(!url)return;patch.logo_url=url}
 if($('#ebrm')?.checked&&!editBrandLogo)patch.logo_url=null;
 if(!Object.keys(patch).length){editingBrand=null;await render();return}
 const{error}=await sb.from('brands').update(patch).eq('id',id);
 if(error){toast(error.message);return}
 if(patch.name)await sb.from('products').update({brand:name}).eq('brand',b.name);
 editingBrand=null;editBrandLogo=null;clearDrafts();toast('Marque mise à jour 🎉');await refreshCats();await refresh()
}
function brandEditCard(b){
 return `<div class="card" style="border:2px solid var(--acc)"><h2 style="margin-top:0">Modifier « ${esc(b.name)} »</h2>
 <div class="grid"><div><label for="ebn">Nom</label><input id="ebn" value="${esc(b.name)}"></div>
 <div><label for="ebl">Nouveau logo (facultatif)</label><input id="ebl" type="file" accept="image/*" onchange="pickEditBrandLogo(this)"></div></div>
 <div class="row" style="align-items:center"><div><label>Logo actuel</label>${b.logo_url?`<img src="${esc(b.logo_url)}" alt="" style="height:80px;max-width:200px;object-fit:contain;border-radius:10px;background:var(--bg);padding:6px">`:'<span class="hint">Aucun logo</span>'}</div><div><label>${b.logo_url?'Remplacé par':'Nouveau'}</label><div id="eblp"><span class="hint">—</span></div></div></div>
 ${b.logo_url?`<label style="display:flex;gap:8px;align-items:center;font-weight:400;margin:0 0 12px"><input type="checkbox" id="ebrm" style="width:auto;min-height:auto">Retirer le logo (la marque s'affichera avec son nom)</label>`:''}
 <div class="row"><button class="btn" onclick="saveBrand('${b.id}')">Enregistrer</button><button class="btn ghost" onclick="clearDrafts();editingBrand=null;editBrandLogo=null;render(true)">Annuler</button></div></div>`;
}
function brandTab(){
 const eb=editingBrand?brands.find(x=>x.id===editingBrand):null;
 return `<div class="card"><h2 style="margin-top:0">Nouvelle marque</h2>
 <div class="grid"><div><label for="newbrand">Nom</label><input id="newbrand" placeholder="Ex. Sophie la Girafe"></div><div><label for="newbrandimg">Logo (facultatif)</label><input id="newbrandimg" type="file" accept="image/*" onchange="pickBrandLogo(this)"></div></div>
 <button class="btn" onclick="addBrand()">Ajouter la marque</button></div>
 ${eb?brandEditCard(eb):''}
 ${brands.length?`<div class="panel scroll"><table><tr><th>Logo</th><th>Nom</th><th class="n">Produits</th><th class="n"></th></tr>${brands.map(b=>`<tr${editingBrand===b.id?' style="background:var(--bg)"':''}><td>${b.logo_url?`<img src="${esc(b.logo_url)}" alt="" style="height:44px;max-width:110px;object-fit:contain;border-radius:8px">`:'<span class="th">🏷️</span>'}</td><td><b>${esc(b.name)}</b></td><td class="n">${products.filter(p=>p.brand===b.name).length}</td><td class="n"><button class="btn ghost" onclick="editBrand('${b.id}')">✏️ Modifier</button> <button class="btn ghost" onclick="delBrand('${b.id}')">Supprimer</button></td></tr>`).join('')}</table></div>`:'<div class="panel empty">Aucune marque pour le moment.</div>'}`;
}


/* ---------- Utilisateurs ---------- */
async function users(){
 const{data}=await sb.from('profiles').select('*').order('created_at');
 const list=data||[];
 return `<h1>Utilisateurs</h1><p class="sub">Gérez les comptes et les rôles de votre équipe.</p>
 ${isAdmin()?`<div class="card"><h2 style="margin-top:0">Nouveau compte</h2>
 <div class="grid"><div><label for="nun">Nom</label><input id="nun"></div><div><label for="nue">Email</label><input id="nue" type="email"></div></div>
 <div class="grid"><div><label for="nup">Mot de passe</label><input id="nup" type="password"></div><div><label for="nur">Rôle</label><select id="nur">${Object.entries(ROLE).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></div></div>
 <button class="btn" onclick="createUser()">Créer le compte</button></div>`:''}
 <div class="panel scroll"><table><tr><th>Nom</th><th>Rôle</th>${isAdmin()?'<th>Nouveau mot de passe</th>':''}<th class="n"></th></tr>${list.map(u=>`<tr><td><input value="${esc(u.name)}" onchange="renameUser('${u.id}',this.value)" style="min-width:140px"></td><td><select onchange="setRole('${u.id}',this.value)">${Object.entries(ROLE).map(([k,l])=>`<option value="${k}" ${u.role===k?'selected':''}>${l}</option>`).join('')}</select></td>${isAdmin()?`<td><div class="row" style="margin:0"><input type="password" id="pw_${u.id}" placeholder="6 caractères min." style="min-width:120px"><button class="btn ghost" onclick="resetPassword('${u.id}')">Réinitialiser</button></div></td>`:''}<td class="n">${u.id===me.id?'<span class="hint">(vous)</span>':''}</td></tr>`).join('')}</table></div>
 <p class="hint">Vendeur : ventes et consultation. Magasinier : produits et entrées. Administrateur : tout, y compris profit et utilisateurs.</p>`;
}
async function resetPassword(id){
 const el=$('#pw_'+id),password=el.value;
 if(!password||password.length<6){toast('Mot de passe : 6 caractères minimum');return}
 const{data,error}=await sb.functions.invoke('reset-password',{body:{userId:id,password}});
 if(error||data?.error){toast((data&&data.error)||error.message||'Erreur lors de la réinitialisation');return}
 el.value='';clearDrafts();toast('Mot de passe mis à jour 🎉')
}
async function createUser(){
 const name=$('#nun').value.trim(),email=$('#nue').value.trim(),password=$('#nup').value,role=$('#nur').value;
 if(!name||!email||!password){toast('Nom, email et mot de passe requis');return}
 if(password.length<6){toast('Mot de passe : 6 caractères minimum');return}
 const{data,error}=await sb.functions.invoke('create-user',{body:{name,email,password,role}});
 if(error||data?.error){toast((data&&data.error)||error.message||'Erreur lors de la création');return}
 $('#nun').value='';$('#nue').value='';$('#nup').value='';
 clearDrafts();toast('Compte créé 🎉');await render()
}
async function renameUser(id,name){await sb.from('profiles').update({name:name.trim()}).eq('id',id);if(id===me.id)me.name=name.trim();await render()}
async function setRole(id,role){const{error}=await sb.from('profiles').update({role}).eq('id',id);if(error){toast(error.message);return}if(id===me.id)me.role=role;await render()}

boot();
</script>
</body>
</html>
